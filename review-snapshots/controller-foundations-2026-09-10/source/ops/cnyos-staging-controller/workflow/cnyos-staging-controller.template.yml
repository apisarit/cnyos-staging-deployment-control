        working-directory: controller
        env:
          CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN: ${{ secrets.CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN }}
          CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY: ${{ secrets.CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY }}
          CNYOS_PRIVATE_DRAFT_ACCESS_BOUNDARY_URL: ${{ vars.CNYOS_PRIVATE_DRAFT_ACCESS_BOUNDARY_URL }}
          CNYOS_PRODUCER_BUNDLE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/producer
          CNYOS_EXPECTED_PRODUCER_MANIFEST_SHA256: ${{ needs.produce.outputs.manifest_sha256 }}
          CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/preflight.json
          CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.preflight_sha256 }}
          CNYOS_CONTROLLER_DRAFT_RECEIPT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-receipt.json
          CNYOS_EXPECTED_DRAFT_RECEIPT_EVIDENCE_SHA256: ${{ needs.draft_deploy.outputs.draft_receipt_sha256 }}
          CNYOS_CONTROLLER_DRAFT_ACCESS_BOUNDARY_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-access-boundary.json
          CNYOS_EXPECTED_DRAFT_ACCESS_BOUNDARY_EVIDENCE_SHA256: ${{ steps.draft_access.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_DRAFT_METADATA_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-metadata.json
          CNYOS_EXPECTED_DRAFT_METADATA_EVIDENCE_SHA256: ${{ needs.verify_draft_metadata.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_DRAFT_VERIFICATION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-verification.json
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN+set}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+set}"
          test -z "${CNYOS_STAGING_NETLIFY_AUTH_TOKEN+set}"
          test -z "${NETLIFY_AUTH_TOKEN+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          node ops/cnyos-staging-controller/scripts/netlify-evidence.mjs verify-draft
          echo "evidence_sha256=$(sha256sum "$CNYOS_CONTROLLER_DRAFT_VERIFICATION_EVIDENCE_PATH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Verify Netlify control-file behavior without publisher credential
        id: control_behavior
        working-directory: controller
        env:
          CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN: ${{ secrets.CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN }}
          CNYOS_PRIVATE_DRAFT_ACCESS_BOUNDARY_URL: ${{ vars.CNYOS_PRIVATE_DRAFT_ACCESS_BOUNDARY_URL }}
          CNYOS_PRODUCER_BUNDLE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/producer
          CNYOS_EXPECTED_PRODUCER_MANIFEST_SHA256: ${{ needs.produce.outputs.manifest_sha256 }}
          CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/preflight.json
          CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.preflight_sha256 }}
          CNYOS_CONTROLLER_DRAFT_RECEIPT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-receipt.json
          CNYOS_EXPECTED_DRAFT_RECEIPT_EVIDENCE_SHA256: ${{ needs.draft_deploy.outputs.draft_receipt_sha256 }}
          CNYOS_CONTROLLER_DRAFT_ACCESS_BOUNDARY_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-access-boundary.json
          CNYOS_EXPECTED_DRAFT_ACCESS_BOUNDARY_EVIDENCE_SHA256: ${{ steps.draft_access.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_DRAFT_VERIFICATION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-verification.json
          CNYOS_EXPECTED_DRAFT_VERIFICATION_EVIDENCE_SHA256: ${{ steps.verify_draft.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_CONTROL_BEHAVIOR_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/control-behavior.json
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN+set}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+set}"
          test -z "${CNYOS_STAGING_NETLIFY_AUTH_TOKEN+set}"
          test -z "${NETLIFY_AUTH_TOKEN+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          node ops/cnyos-staging-controller/scripts/verify-netlify-control-file-behavior.mjs
          echo "evidence_sha256=$(sha256sum "$CNYOS_CONTROLLER_CONTROL_BEHAVIOR_EVIDENCE_PATH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Retain only access-boundary-derived draft evidence
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-content-${{ github.run_id }}
          path: |
            controller/release-chain/evidence/draft-access-boundary.json
            controller/release-chain/evidence/draft-verification.json
            controller/release-chain/evidence/control-behavior.json
          if-no-files-found: error
          retention-days: 90

  verify_draft:
    name: Close draft lifecycle evidence on a publisher-only runner
    needs: [produce, authorize_preflight, rollback_readiness, draft_gate, draft_deploy, verify_draft_metadata, verify_draft_content]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cnyos-staging-publish
    permissions:
      contents: read
      id-token: none
    outputs:
      draft_verification_sha256: ${{ needs.verify_draft_content.outputs.draft_verification_sha256 }}
      draft_access_boundary_sha256: ${{ needs.verify_draft_content.outputs.draft_access_boundary_sha256 }}
      draft_metadata_sha256: ${{ needs.verify_draft_metadata.outputs.evidence_sha256 }}
      control_behavior_sha256: ${{ needs.verify_draft_content.outputs.control_behavior_sha256 }}
      private_draft_sha256: ${{ steps.bind_draft_evidence.outputs.private_draft_sha256 }}
    steps:
      - name: Check out protected controller
        uses: actions/checkout@__PINNED_CHECKOUT_COMMIT_SHA__
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Download exact producer artifact
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-producer-${{ github.run_id }}
          path: controller/release-chain/producer
      - name: Download exact draft evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact access-boundary-derived evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-content-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download publisher-derived metadata from its direct producer
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-metadata-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Set up publisher-only lifecycle runtime
        uses: actions/setup-node@__PINNED_SETUP_NODE_COMMIT_SHA__
        with:
          node-version: 24.20.0
      - name: Verify private draft lifecycle without access-boundary credential
        id: private_draft
        working-directory: controller
        env:
          CNYOS_CONTROLLER_DRAFT_INTENT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-intent.json
          CNYOS_EXPECTED_DRAFT_INTENT_EVIDENCE_SHA256: ${{ needs.draft_deploy.outputs.draft_intent_sha256 }}
          CNYOS_CONTROLLER_DRAFT_GATE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-gate.json
          CNYOS_EXPECTED_DRAFT_GATE_EVIDENCE_SHA256: ${{ needs.draft_gate.outputs.draft_gate_sha256 }}
          CNYOS_CONTROLLER_ROLLBACK_READINESS_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/rollback-readiness.json
          CNYOS_EXPECTED_ROLLBACK_READINESS_EVIDENCE_SHA256: ${{ needs.rollback_readiness.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_DRAFT_METADATA_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-metadata.json
          CNYOS_EXPECTED_DRAFT_METADATA_EVIDENCE_SHA256: ${{ needs.verify_draft_metadata.outputs.evidence_sha256 }}
          CNYOS_STAGING_NETLIFY_AUTH_TOKEN: ${{ secrets.CNYOS_STAGING_NETLIFY_AUTH_TOKEN }}
          CNYOS_PRIVATE_DRAFT_ACCESS_BOUNDARY_URL: ${{ vars.CNYOS_PRIVATE_DRAFT_ACCESS_BOUNDARY_URL }}
          CNYOS_PRODUCER_BUNDLE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/producer
          CNYOS_EXPECTED_PRODUCER_MANIFEST_SHA256: ${{ needs.produce.outputs.manifest_sha256 }}
          CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/preflight.json
          CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.preflight_sha256 }}
          CNYOS_CONTROLLER_DRAFT_RECEIPT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-receipt.json
          CNYOS_EXPECTED_DRAFT_RECEIPT_EVIDENCE_SHA256: ${{ needs.draft_deploy.outputs.draft_receipt_sha256 }}
          CNYOS_CONTROLLER_DRAFT_ACCESS_BOUNDARY_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-access-boundary.json
          CNYOS_EXPECTED_DRAFT_ACCESS_BOUNDARY_EVIDENCE_SHA256: ${{ needs.verify_draft_content.outputs.draft_access_boundary_sha256 }}
          CNYOS_CONTROLLER_DRAFT_VERIFICATION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-verification.json
          CNYOS_EXPECTED_DRAFT_VERIFICATION_EVIDENCE_SHA256: ${{ needs.verify_draft_content.outputs.draft_verification_sha256 }}
          CNYOS_CONTROLLER_CONTROL_BEHAVIOR_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/control-behavior.json
          CNYOS_EXPECTED_CONTROL_BEHAVIOR_EVIDENCE_SHA256: ${{ needs.verify_draft_content.outputs.control_behavior_sha256 }}
          CNYOS_CONTROLLER_PRIVATE_DRAFT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/private-draft.json
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN+set}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+set}"
          test -z "${CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN+set}"
          test -z "${CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          node ops/cnyos-staging-controller/scripts/verify-private-draft-lifecycle.mjs
      - name: Bind exact hashes from every credential-isolated draft runner
        id: bind_draft_evidence
        working-directory: controller
        env:
          CNYOS_EXPECTED_DRAFT_ACCESS_BOUNDARY_EVIDENCE_SHA256: ${{ needs.verify_draft_content.outputs.draft_access_boundary_sha256 }}
          CNYOS_EXPECTED_DRAFT_METADATA_EVIDENCE_SHA256: ${{ needs.verify_draft_metadata.outputs.evidence_sha256 }}
          CNYOS_EXPECTED_DRAFT_VERIFICATION_EVIDENCE_SHA256: ${{ needs.verify_draft_content.outputs.draft_verification_sha256 }}
          CNYOS_EXPECTED_CONTROL_BEHAVIOR_EVIDENCE_SHA256: ${{ needs.verify_draft_content.outputs.control_behavior_sha256 }}
          CNYOS_CONTROLLER_EVIDENCE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/evidence
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN+set}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+set}"
          test -z "${CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN+set}"
          test -z "${CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          for evidence_name in \
            draft-access-boundary.json \
            draft-metadata.json \
            draft-verification.json \
            control-behavior.json \
            private-draft.json
          do
            evidence_path="$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/$evidence_name"
            test -f "$evidence_path"
            test ! -L "$evidence_path"
          done
          for expected_digest in \
            "$CNYOS_EXPECTED_DRAFT_ACCESS_BOUNDARY_EVIDENCE_SHA256" \
            "$CNYOS_EXPECTED_DRAFT_METADATA_EVIDENCE_SHA256" \
            "$CNYOS_EXPECTED_DRAFT_VERIFICATION_EVIDENCE_SHA256" \
            "$CNYOS_EXPECTED_CONTROL_BEHAVIOR_EVIDENCE_SHA256"
          do
            echo "$expected_digest" | grep -Eq '^[0-9a-f]{64}$'
          done
          test "$(sha256sum "$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/draft-access-boundary.json" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_DRAFT_ACCESS_BOUNDARY_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/draft-metadata.json" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_DRAFT_METADATA_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/draft-verification.json" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_DRAFT_VERIFICATION_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/control-behavior.json" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_CONTROL_BEHAVIOR_EVIDENCE_SHA256"
          private_draft_sha256="$(sha256sum "$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/private-draft.json" | cut -d ' ' -f 1)"
          echo "$private_draft_sha256" | grep -Eq '^[0-9a-f]{64}$'
          echo "private_draft_sha256=$private_draft_sha256" >> "$GITHUB_OUTPUT"
      - name: Retain the complete cross-runner draft verification chain
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-verification-${{ github.run_id }}
          path: |
            controller/release-chain/evidence/draft-access-boundary.json
            controller/release-chain/evidence/draft-metadata.json
            controller/release-chain/evidence/draft-verification.json
            controller/release-chain/evidence/control-behavior.json
            controller/release-chain/evidence/private-draft.json
          if-no-files-found: error
          retention-days: 90

  verify_github_release_boundary_prepromotion:
    name: Reverify live GitHub release boundary immediately before promotion
    needs: [authorize_release, authorize_preflight, rollback_readiness, draft_deploy, verify_draft, verify_github_release_boundary_precredential]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      evidence_sha256: ${{ steps.github_boundary.outputs.evidence_sha256 }}
    steps:
      - name: Check out protected controller for final isolated GitHub read
        uses: actions/checkout@__PINNED_CHECKOUT_COMMIT_SHA__
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Download sanitized authorization for final isolated GitHub read
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-authorization-${{ github.run_id }}
          path: controller/release-boundary
      - name: Download prior isolated GitHub boundary
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-github-precredential-${{ github.run_id }}
          path: controller/release-boundary
      - name: Requery PR 36 and the separate promotion PR with read-only identity
        id: github_boundary
        working-directory: controller
        env:
          CNYOS_GITHUB_ACTIONS_READ_TOKEN: ${{ github.token }}
          CNYOS_CONTROLLER_AUTHORIZATION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-boundary/authorization.json
          CNYOS_EXPECTED_AUTHORIZATION_EVIDENCE_SHA256: ${{ needs.authorize_release.outputs.authorization_sha256 }}
          CNYOS_GITHUB_RELEASE_BOUNDARY_PHASE: before_promotion
          CNYOS_CONTROLLER_PRIOR_GITHUB_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-boundary/github-release-precredential.json
          CNYOS_EXPECTED_PRIOR_GITHUB_RELEASE_EVIDENCE_SHA256: ${{ needs.verify_github_release_boundary_precredential.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_GITHUB_RELEASE_EVIDENCE_PATH: ${{ runner.temp }}/github-release-prepromotion.json
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN+set}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+set}"
          test -z "${CNYOS_STAGING_NETLIFY_AUTH_TOKEN+set}"
          test -z "${CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          test -z "${CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN+set}"
          node ops/cnyos-staging-controller/scripts/verify-live-github-release-boundary.mjs query
          echo "evidence_sha256=$(sha256sum "$CNYOS_CONTROLLER_GITHUB_RELEASE_EVIDENCE_PATH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Retain isolated prepromotion GitHub evidence
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-github-prepromotion-${{ github.run_id }}
          path: ${{ runner.temp }}/github-release-prepromotion.json
          if-no-files-found: error
          retention-days: 90

  acquire_exclusive_publisher:
    name: Acquire the exclusive publisher lease with OIDC only
    needs: [produce, authorize_preflight, rollback_readiness, draft_deploy, verify_draft, verify_github_release_boundary_prepromotion]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cnyos-staging-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      attempt_sha256: ${{ steps.attempt.outputs.attempt_sha256 }}
      exclusive_publisher_sha256: ${{ steps.attempt.outputs.exclusive_publisher_sha256 }}
    steps:
      - name: Check out protected controller
        uses: actions/checkout@__PINNED_CHECKOUT_COMMIT_SHA__
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Download exact preflight evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-preflight-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact draft evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact draft verification
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-verification-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact rollback-readiness evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-rollback-readiness-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download final isolated GitHub boundary
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-github-prepromotion-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Set up exclusive-publisher broker runtime
        uses: actions/setup-node@__PINNED_SETUP_NODE_COMMIT_SHA__
        with:
          node-version: 24.20.0
      - name: Acquire lease and persist exact promotion attempt without deployment or database credentials
        id: attempt
        working-directory: controller
        env:
          CNYOS_CONTROLLER_AUTHORIZATION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/authorization.json
          CNYOS_EXPECTED_AUTHORIZATION_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.authorization_sha256 }}
          CNYOS_GITHUB_RELEASE_BOUNDARY_PHASE: before_promotion
          CNYOS_CONTROLLER_PRIOR_GITHUB_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/github-release-precredential.json
          CNYOS_EXPECTED_PRIOR_GITHUB_RELEASE_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.live_github_precredential_sha256 }}
          CNYOS_CONTROLLER_GITHUB_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/github-release-prepromotion.json
          CNYOS_EXPECTED_GITHUB_RELEASE_EVIDENCE_SHA256: ${{ needs.verify_github_release_boundary_prepromotion.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/preflight.json
          CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.preflight_sha256 }}
          CNYOS_CONTROLLER_ROLLBACK_READINESS_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/rollback-readiness.json
          CNYOS_EXPECTED_ROLLBACK_READINESS_EVIDENCE_SHA256: ${{ needs.rollback_readiness.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_DRAFT_GATE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-gate.json
          CNYOS_EXPECTED_DRAFT_GATE_EVIDENCE_SHA256: ${{ needs.draft_deploy.outputs.draft_gate_sha256 }}
          CNYOS_CONTROLLER_DRAFT_VERIFICATION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-verification.json
          CNYOS_EXPECTED_DRAFT_VERIFICATION_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.draft_verification_sha256 }}
          CNYOS_CONTROLLER_DRAFT_METADATA_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-metadata.json
          CNYOS_EXPECTED_DRAFT_METADATA_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.draft_metadata_sha256 }}
          CNYOS_CONTROLLER_CONTROL_BEHAVIOR_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/control-behavior.json
          CNYOS_EXPECTED_CONTROL_BEHAVIOR_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.control_behavior_sha256 }}
          CNYOS_CONTROLLER_PRIVATE_DRAFT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/private-draft.json
          CNYOS_EXPECTED_PRIVATE_DRAFT_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.private_draft_sha256 }}
          CNYOS_CONTROLLER_EXCLUSIVE_PUBLISHER_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/exclusive-publisher.json
          CNYOS_NETLIFY_PUBLISH_BROKER_URL: ${{ vars.CNYOS_NETLIFY_PUBLISH_BROKER_URL }}
          CNYOS_CONTROLLER_PUBLISH_ATTEMPT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/promotion-attempt.json
        run: |
          test -z "${CNYOS_STAGING_NETLIFY_AUTH_TOKEN+set}"
          test -z "${NETLIFY_AUTH_TOKEN+set}"
          test -z "${CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          test -z "${CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN+set}"
          test -z "${CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY+set}"
          test "$(sha256sum "$CNYOS_CONTROLLER_AUTHORIZATION_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_AUTHORIZATION_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_PRIOR_GITHUB_RELEASE_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_PRIOR_GITHUB_RELEASE_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_GITHUB_RELEASE_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_GITHUB_RELEASE_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_ROLLBACK_READINESS_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_ROLLBACK_READINESS_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_DRAFT_GATE_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_DRAFT_GATE_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_DRAFT_VERIFICATION_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_DRAFT_VERIFICATION_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_DRAFT_METADATA_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_DRAFT_METADATA_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_CONTROL_BEHAVIOR_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_CONTROL_BEHAVIOR_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_PRIVATE_DRAFT_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_PRIVATE_DRAFT_EVIDENCE_SHA256"
          node ops/cnyos-staging-controller/scripts/verify-netlify-exclusive-publisher.mjs
          export CNYOS_EXPECTED_EXCLUSIVE_PUBLISHER_EVIDENCE_SHA256="$(sha256sum "$CNYOS_CONTROLLER_EXCLUSIVE_PUBLISHER_EVIDENCE_PATH" | cut -d ' ' -f 1)"
          node ops/cnyos-staging-controller/scripts/netlify-evidence.mjs promotion-attempt
          echo "attempt_sha256=$(sha256sum "$CNYOS_CONTROLLER_PUBLISH_ATTEMPT_EVIDENCE_PATH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "exclusive_publisher_sha256=$CNYOS_EXPECTED_EXCLUSIVE_PUBLISHER_EVIDENCE_SHA256" >> "$GITHUB_OUTPUT"
      - name: Durably retain promotion marker before mutation
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-attempt-${{ github.run_id }}
          path: |
            controller/release-chain/evidence/promotion-attempt.json
            controller/release-chain/evidence/exclusive-publisher.json
          if-no-files-found: error
          retention-days: 90

  promote_and_validate:
    name: Promote exact draft and verify bytes on a publisher-only runner
    needs: [produce, authorize_preflight, rollback_readiness, draft_deploy, verify_draft, verify_github_release_boundary_prepromotion, acquire_exclusive_publisher]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cnyos-staging-publish
    permissions:
      contents: read
      id-token: none
    outputs:
      deploy_id: ${{ steps.promote.outputs.deploy_id }}
      attempt_sha256: ${{ needs.acquire_exclusive_publisher.outputs.attempt_sha256 }}
      exclusive_publisher_sha256: ${{ needs.acquire_exclusive_publisher.outputs.exclusive_publisher_sha256 }}
      promotion_sha256: ${{ steps.promote.outputs.promotion_sha256 }}
      post_promotion_sha256: ${{ steps.verify_promoted.outputs.post_promotion_sha256 }}
    steps:
      - name: Check out protected controller
        uses: actions/checkout@__PINNED_CHECKOUT_COMMIT_SHA__
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Download exact producer artifact
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-producer-${{ github.run_id }}
          path: controller/release-chain/producer
      - name: Download exact preflight evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-preflight-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact draft evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact draft verification
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-verification-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact rollback-readiness evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-rollback-readiness-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download final isolated GitHub boundary
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-github-prepromotion-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact exclusive-publisher lease and promotion marker
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-attempt-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Set up critical-section runtime
        uses: actions/setup-node@__PINNED_SETUP_NODE_COMMIT_SHA__
        with:
          node-version: 24.20.0
      - name: Promote only the receipt-bound draft
        id: promote
        working-directory: controller
        env:
          CNYOS_STAGING_NETLIFY_AUTH_TOKEN: ${{ secrets.CNYOS_STAGING_NETLIFY_AUTH_TOKEN }}
          CNYOS_CONTROLLER_AUTHORIZATION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/authorization.json
          CNYOS_EXPECTED_AUTHORIZATION_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.authorization_sha256 }}
          CNYOS_GITHUB_RELEASE_BOUNDARY_PHASE: before_promotion
          CNYOS_CONTROLLER_PRIOR_GITHUB_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/github-release-precredential.json
          CNYOS_EXPECTED_PRIOR_GITHUB_RELEASE_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.live_github_precredential_sha256 }}
          CNYOS_CONTROLLER_GITHUB_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/github-release-prepromotion.json
          CNYOS_EXPECTED_GITHUB_RELEASE_EVIDENCE_SHA256: ${{ needs.verify_github_release_boundary_prepromotion.outputs.evidence_sha256 }}
          CNYOS_PRODUCER_BUNDLE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/producer
          CNYOS_EXPECTED_PRODUCER_MANIFEST_SHA256: ${{ needs.produce.outputs.manifest_sha256 }}
          CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/preflight.json
          CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.preflight_sha256 }}
          CNYOS_CONTROLLER_ROLLBACK_READINESS_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/rollback-readiness.json
          CNYOS_EXPECTED_ROLLBACK_READINESS_EVIDENCE_SHA256: ${{ needs.rollback_readiness.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_DRAFT_GATE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-gate.json
          CNYOS_EXPECTED_DRAFT_GATE_EVIDENCE_SHA256: ${{ needs.draft_deploy.outputs.draft_gate_sha256 }}
          CNYOS_CONTROLLER_DRAFT_VERIFICATION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-verification.json
          CNYOS_EXPECTED_DRAFT_VERIFICATION_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.draft_verification_sha256 }}
          CNYOS_CONTROLLER_DRAFT_METADATA_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-metadata.json
          CNYOS_EXPECTED_DRAFT_METADATA_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.draft_metadata_sha256 }}
          CNYOS_CONTROLLER_CONTROL_BEHAVIOR_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/control-behavior.json
          CNYOS_EXPECTED_CONTROL_BEHAVIOR_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.control_behavior_sha256 }}
          CNYOS_CONTROLLER_PRIVATE_DRAFT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/private-draft.json
          CNYOS_EXPECTED_PRIVATE_DRAFT_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.private_draft_sha256 }}
          CNYOS_CONTROLLER_EXCLUSIVE_PUBLISHER_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/exclusive-publisher.json
          CNYOS_EXPECTED_EXCLUSIVE_PUBLISHER_EVIDENCE_SHA256: ${{ needs.acquire_exclusive_publisher.outputs.exclusive_publisher_sha256 }}
          CNYOS_CONTROLLER_PUBLISH_ATTEMPT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/promotion-attempt.json
          CNYOS_EXPECTED_PUBLISH_ATTEMPT_EVIDENCE_SHA256: ${{ needs.acquire_exclusive_publisher.outputs.attempt_sha256 }}
          CNYOS_CONTROLLER_PROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/promotion.json
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN+set}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+set}"
          test -z "${CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          test -z "${CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN+set}"
          test -z "${CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY+set}"
          node ops/cnyos-staging-controller/scripts/verify-producer-bundle.mjs
          test "$(sha256sum "$CNYOS_CONTROLLER_AUTHORIZATION_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_AUTHORIZATION_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_PRIOR_GITHUB_RELEASE_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_PRIOR_GITHUB_RELEASE_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_GITHUB_RELEASE_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_GITHUB_RELEASE_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_ROLLBACK_READINESS_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_ROLLBACK_READINESS_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_DRAFT_GATE_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_DRAFT_GATE_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_DRAFT_VERIFICATION_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_DRAFT_VERIFICATION_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_DRAFT_METADATA_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_DRAFT_METADATA_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_CONTROL_BEHAVIOR_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_CONTROL_BEHAVIOR_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_PRIVATE_DRAFT_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_PRIVATE_DRAFT_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_EXCLUSIVE_PUBLISHER_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_EXCLUSIVE_PUBLISHER_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_PUBLISH_ATTEMPT_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_PUBLISH_ATTEMPT_EVIDENCE_SHA256"
          node ops/cnyos-staging-controller/scripts/netlify-evidence.mjs promote
          echo "promotion_sha256=$(sha256sum "$CNYOS_CONTROLLER_PROMOTION_EVIDENCE_PATH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$(node -e 'const m=require(process.argv[1]);process.stdout.write(m.promotedDeployId)' "$CNYOS_CONTROLLER_PROMOTION_EVIDENCE_PATH")" >> "$GITHUB_OUTPUT"
      - name: Verify promoted bytes
        id: verify_promoted
        working-directory: controller
        env:
          CNYOS_STAGING_NETLIFY_AUTH_TOKEN: ${{ secrets.CNYOS_STAGING_NETLIFY_AUTH_TOKEN }}
          CNYOS_EXPECTED_SOURCE_COMMIT: ${{ inputs.candidate_sha }}
          CNYOS_EXPECTED_SOURCE_TREE: ${{ needs.produce.outputs.candidate_tree }}
          CNYOS_EXPECTED_NETLIFY_DEPLOY_ID: ${{ steps.promote.outputs.deploy_id }}
          CNYOS_PRODUCER_BUNDLE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/producer
          CNYOS_EXPECTED_PRODUCER_MANIFEST_SHA256: ${{ needs.produce.outputs.manifest_sha256 }}
          CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/preflight.json
          CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.preflight_sha256 }}
          CNYOS_CONTROLLER_PROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/promotion.json
          CNYOS_EXPECTED_PROMOTION_EVIDENCE_SHA256: ${{ steps.promote.outputs.promotion_sha256 }}
          CNYOS_CONTROLLER_POST_PROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/post-promotion.json
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN+set}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+set}"
          test -z "${CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          test -z "${CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN+set}"
          node ops/cnyos-staging-controller/scripts/netlify-evidence.mjs verify-promoted
          POST_PROMOTION_SHA="$(sha256sum "$CNYOS_CONTROLLER_POST_PROMOTION_EVIDENCE_PATH" | cut -d ' ' -f 1)"
          echo "post_promotion_sha256=$POST_PROMOTION_SHA" >> "$GITHUB_OUTPUT"
      - name: Retain only the publisher-derived promotion evidence
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-promotion-${{ github.run_id }}
          path: |
            controller/release-chain/evidence/promotion.json
            controller/release-chain/evidence/post-promotion.json
          if-no-files-found: error
          retention-days: 90

  validate_promoted_routes:
    name: Deny public scheduled routes on a credential-free runner
    needs: [produce, authorize_preflight, promote_and_validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: none
    outputs:
      evidence_sha256: ${{ steps.scheduled_route_denial.outputs.evidence_sha256 }}
    steps:
      - name: Check out protected controller
        uses: actions/checkout@__PINNED_CHECKOUT_COMMIT_SHA__
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Download exact producer artifact
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-producer-${{ github.run_id }}
          path: controller/release-chain/producer
      - name: Download exact preflight evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-preflight-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download publisher-derived promotion evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-promotion-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Set up credential-free route verifier runtime
        uses: actions/setup-node@__PINNED_SETUP_NODE_COMMIT_SHA__
        with:
          node-version: 24.20.0
      - name: Deny public scheduled Function routes without publisher credentials
        id: scheduled_route_denial
        working-directory: controller
        env:
          CNYOS_EXPECTED_SOURCE_COMMIT: ${{ inputs.candidate_sha }}
          CNYOS_EXPECTED_SOURCE_TREE: ${{ needs.produce.outputs.candidate_tree }}
          CNYOS_EXPECTED_NETLIFY_DEPLOY_ID: ${{ needs.promote_and_validate.outputs.deploy_id }}
          CNYOS_PRODUCER_BUNDLE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/producer
          CNYOS_EXPECTED_PRODUCER_MANIFEST_SHA256: ${{ needs.produce.outputs.manifest_sha256 }}
          CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/preflight.json
          CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.preflight_sha256 }}
          CNYOS_CONTROLLER_PROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/promotion.json
          CNYOS_EXPECTED_PROMOTION_EVIDENCE_SHA256: ${{ needs.promote_and_validate.outputs.promotion_sha256 }}
          CNYOS_CONTROLLER_POST_PROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/post-promotion.json
          CNYOS_EXPECTED_POST_PROMOTION_EVIDENCE_SHA256: ${{ needs.promote_and_validate.outputs.post_promotion_sha256 }}
          CNYOS_CONTROLLER_SCHEDULED_ROUTE_DENIAL_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/scheduled-route-denial.json
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN+set}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+set}"
          test -z "${CNYOS_STAGING_NETLIFY_AUTH_TOKEN+set}"
          test -z "${NETLIFY_AUTH_TOKEN+set}"
          test -z "${CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          test -z "${CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN+set}"
          test -z "${CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY+set}"
          node ops/cnyos-staging-controller/scripts/scheduled-function-route-denial.mjs
          echo "evidence_sha256=$(sha256sum "$CNYOS_CONTROLLER_SCHEDULED_ROUTE_DENIAL_EVIDENCE_PATH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Retain only credential-free route-denial evidence
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-scheduled-route-denial-${{ github.run_id }}
          path: controller/release-chain/evidence/scheduled-route-denial.json
          if-no-files-found: error
          retention-days: 90

  run_promoted_uat:
    name: Run synthetic UAT on a database-only runner
    needs: [produce, promote_and_validate, validate_promoted_routes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cnyos-staging-publish
    permissions:
      contents: read
      id-token: none
    outputs:
      uat_sha256: ${{ steps.uat.outputs.uat_sha256 }}
    steps:
      - name: Check out protected controller
        uses: actions/checkout@__PINNED_CHECKOUT_COMMIT_SHA__
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Download exact producer artifact
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-producer-${{ github.run_id }}
          path: controller/release-chain/producer
      - name: Download publisher-derived promotion evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-promotion-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download credential-free route-denial evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-scheduled-route-denial-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Set up database-only UAT runtime
        uses: actions/setup-node@__PINNED_SETUP_NODE_COMMIT_SHA__
        with:
          node-version: 24.20.0
      - name: Run synthetic authenticated UAT without publisher credentials
        id: uat
        working-directory: controller
        env:
          CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          CNYOS_STAGING_TEST_PASSWORD: ${{ secrets.CNYOS_STAGING_TEST_PASSWORD }}
          CNYOS_EXPECTED_SOURCE_COMMIT: ${{ inputs.candidate_sha }}
          CNYOS_EXPECTED_SOURCE_TREE: ${{ needs.produce.outputs.candidate_tree }}
          CNYOS_EXPECTED_NETLIFY_DEPLOY_ID: ${{ needs.promote_and_validate.outputs.deploy_id }}
          CNYOS_PRODUCER_BUNDLE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/producer
          CNYOS_EXPECTED_PRODUCER_MANIFEST_SHA256: ${{ needs.produce.outputs.manifest_sha256 }}
          CNYOS_CONTROLLER_PROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/promotion.json
          CNYOS_EXPECTED_PROMOTION_EVIDENCE_SHA256: ${{ needs.promote_and_validate.outputs.promotion_sha256 }}
          CNYOS_CONTROLLER_POST_PROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/post-promotion.json
          CNYOS_EXPECTED_POST_PROMOTION_EVIDENCE_SHA256: ${{ needs.promote_and_validate.outputs.post_promotion_sha256 }}
          CNYOS_CONTROLLER_SCHEDULED_ROUTE_DENIAL_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/scheduled-route-denial.json
          CNYOS_EXPECTED_SCHEDULED_ROUTE_DENIAL_EVIDENCE_SHA256: ${{ needs.validate_promoted_routes.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_UAT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/uat.json
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN+set}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+set}"
          test -z "${CNYOS_STAGING_NETLIFY_AUTH_TOKEN+set}"
          test -z "${NETLIFY_AUTH_TOKEN+set}"
          test -z "${CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN+set}"
          test -z "${CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN+set}"
          test -z "${CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY+set}"
          node ops/cnyos-staging-controller/scripts/controller-authenticated-uat.mjs
          echo "uat_sha256=$(sha256sum "$CNYOS_CONTROLLER_UAT_EVIDENCE_PATH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Retain only database-authenticated UAT evidence
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-promoted-uat-${{ github.run_id }}
          path: controller/release-chain/evidence/uat.json
          if-no-files-found: error
          retention-days: 90

  verify_promoted_final_current:
    name: Recheck final current deploy on a publisher-only runner
    needs: [produce, authorize_preflight, promote_and_validate, validate_promoted_routes, run_promoted_uat]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cnyos-staging-publish
    permissions:
      contents: read
      id-token: none
    outputs:
      final_current_sha256: ${{ steps.bind_promotion_evidence.outputs.final_current_sha256 }}
      scheduled_route_denial_sha256: ${{ needs.validate_promoted_routes.outputs.evidence_sha256 }}
      uat_sha256: ${{ needs.run_promoted_uat.outputs.uat_sha256 }}
    steps:
      - name: Check out protected controller
        uses: actions/checkout@__PINNED_CHECKOUT_COMMIT_SHA__
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Download exact producer artifact
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-producer-${{ github.run_id }}
          path: controller/release-chain/producer
      - name: Download exact preflight evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-preflight-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download publisher-derived promotion evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-promotion-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download credential-free route-denial evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-scheduled-route-denial-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download database-authenticated UAT evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-promoted-uat-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Set up publisher-only final-current runtime
        uses: actions/setup-node@__PINNED_SETUP_NODE_COMMIT_SHA__
        with:
          node-version: 24.20.0
      - name: Recheck exact current deploy after UAT
        id: final_current
        working-directory: controller
        env:
          CNYOS_STAGING_NETLIFY_AUTH_TOKEN: ${{ secrets.CNYOS_STAGING_NETLIFY_AUTH_TOKEN }}
          CNYOS_PRODUCER_BUNDLE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/producer
          CNYOS_EXPECTED_PRODUCER_MANIFEST_SHA256: ${{ needs.produce.outputs.manifest_sha256 }}
          CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/preflight.json
          CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.preflight_sha256 }}
          CNYOS_CONTROLLER_PROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/promotion.json
          CNYOS_EXPECTED_PROMOTION_EVIDENCE_SHA256: ${{ needs.promote_and_validate.outputs.promotion_sha256 }}
          CNYOS_CONTROLLER_FINAL_CURRENT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/final-current.json
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN+set}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+set}"
          test -z "${CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          test -z "${CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN+set}"
          node ops/cnyos-staging-controller/scripts/netlify-evidence.mjs verify-final-current
      - name: Bind exact hashes from every credential-isolated promotion runner
        id: bind_promotion_evidence
        working-directory: controller
        env:
          CNYOS_EXPECTED_PROMOTION_EVIDENCE_SHA256: ${{ needs.promote_and_validate.outputs.promotion_sha256 }}
          CNYOS_EXPECTED_POST_PROMOTION_EVIDENCE_SHA256: ${{ needs.promote_and_validate.outputs.post_promotion_sha256 }}
          CNYOS_EXPECTED_SCHEDULED_ROUTE_DENIAL_EVIDENCE_SHA256: ${{ needs.validate_promoted_routes.outputs.evidence_sha256 }}
          CNYOS_EXPECTED_UAT_EVIDENCE_SHA256: ${{ needs.run_promoted_uat.outputs.uat_sha256 }}
          CNYOS_CONTROLLER_EVIDENCE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/evidence
        run: |
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN+set}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          test -z "${CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN+set}"
          test -z "${CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY+set}"
          for evidence_name in \
            promotion.json \
            post-promotion.json \
            scheduled-route-denial.json \
            uat.json \
            final-current.json
          do
            evidence_path="$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/$evidence_name"
            test -f "$evidence_path"
            test ! -L "$evidence_path"
          done
          for expected_digest in \
            "$CNYOS_EXPECTED_PROMOTION_EVIDENCE_SHA256" \
            "$CNYOS_EXPECTED_POST_PROMOTION_EVIDENCE_SHA256" \
            "$CNYOS_EXPECTED_SCHEDULED_ROUTE_DENIAL_EVIDENCE_SHA256" \
            "$CNYOS_EXPECTED_UAT_EVIDENCE_SHA256"
          do
            echo "$expected_digest" | grep -Eq '^[0-9a-f]{64}$'
          done
          test "$(sha256sum "$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/promotion.json" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_PROMOTION_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/post-promotion.json" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_POST_PROMOTION_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/scheduled-route-denial.json" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_SCHEDULED_ROUTE_DENIAL_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/uat.json" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_UAT_EVIDENCE_SHA256"
          final_current_sha256="$(sha256sum "$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/final-current.json" | cut -d ' ' -f 1)"
          echo "$final_current_sha256" | grep -Eq '^[0-9a-f]{64}$'
          echo "final_current_sha256=$final_current_sha256" >> "$GITHUB_OUTPUT"
      - name: Retain the complete cross-runner promotion validation chain
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-promotion-validation-${{ github.run_id }}
          path: |
            controller/release-chain/evidence/promotion.json
            controller/release-chain/evidence/post-promotion.json
            controller/release-chain/evidence/scheduled-route-denial.json
            controller/release-chain/evidence/uat.json
            controller/release-chain/evidence/final-current.json
          if-no-files-found: error
          retention-days: 90

  release_and_finalize:
    name: Release publisher lease into barrier-held state and finalize locally
    needs: [produce, authorize_preflight, rollback_readiness, draft_deploy, verify_draft, verify_github_release_boundary_prepromotion, acquire_exclusive_publisher, promote_and_validate, validate_promoted_routes, run_promoted_uat, verify_promoted_final_current]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cnyos-staging-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      publisher_release_sha256: ${{ steps.release_publisher.outputs.publisher_release_sha256 }}
      final_sha256: ${{ steps.finalize.outputs.final_sha256 }}
    steps:
      - name: Check out protected controller
        uses: actions/checkout@__PINNED_CHECKOUT_COMMIT_SHA__
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Download exact producer artifact
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-producer-${{ github.run_id }}
          path: controller/release-chain/producer
      - name: Download exact draft-chain evidence from its direct producer
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact preflight evidence from its direct producer
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-preflight-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact rollback-readiness evidence from its direct producer
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-rollback-readiness-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact draft-verification evidence from its direct producer
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-verification-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact prepromotion GitHub evidence from its direct producer
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-github-prepromotion-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact publisher-attempt evidence from its direct producer
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-attempt-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download exact promotion and validation evidence
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-promotion-validation-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Require the complete direct-producer evidence set as regular files
        working-directory: controller
        env:
          CNYOS_CONTROLLER_EVIDENCE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/evidence
        run: |
          test -d "$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY"
          test ! -L "$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY"
          for evidence_name in \
            pre-release-reconciliation.json \
            authorization.json \
            authorization-verification-bundle.json \
            github-release-precredential.json \
            github-release-prepromotion.json \
            rollback-attestation-deposit-receipt.json \
            rollback-attestation-deposit-validation.json \
            live-netlify-authority-boundary.json \
            function-environment.json \
            backup-disable-runtime-boundary.json \
            runtime-capability.json \
            runtime-proof-envelope.json \
            preflight.json \
            rollback-readiness.json \
            draft-gate.json \
            draft-intent.json \
            draft-receipt.json \
            draft-access-boundary.json \
            draft-metadata.json \
            draft-verification.json \
            control-behavior.json \
            private-draft.json \
            exclusive-publisher.json \
            promotion-attempt.json \
            promotion.json \
            post-promotion.json \
            scheduled-route-denial.json \
            uat.json \
            final-current.json
          do
            evidence_path="$CNYOS_CONTROLLER_EVIDENCE_DIRECTORY/$evidence_name"
            test -f "$evidence_path"
            test ! -L "$evidence_path"
          done
      - name: Set up lease-release and finalization runtime
        uses: actions/setup-node@__PINNED_SETUP_NODE_COMMIT_SHA__
        with:
          node-version: 24.20.0
      - name: Atomically release the publisher lease while retaining the run barrier
        id: release_publisher
        working-directory: controller
        env:
          CNYOS_NETLIFY_PUBLISH_BROKER_URL: ${{ vars.CNYOS_NETLIFY_PUBLISH_BROKER_URL }}
          CNYOS_EXPECTED_NETLIFY_DEPLOY_ID: ${{ needs.promote_and_validate.outputs.deploy_id }}
          CNYOS_PRODUCER_BUNDLE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/producer
          CNYOS_EXPECTED_PRODUCER_MANIFEST_SHA256: ${{ needs.produce.outputs.manifest_sha256 }}
          CNYOS_CONTROLLER_EXCLUSIVE_PUBLISHER_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/exclusive-publisher.json
          CNYOS_EXPECTED_EXCLUSIVE_PUBLISHER_EVIDENCE_SHA256: ${{ needs.acquire_exclusive_publisher.outputs.exclusive_publisher_sha256 }}
          CNYOS_CONTROLLER_PUBLISH_ATTEMPT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/promotion-attempt.json
          CNYOS_EXPECTED_PUBLISH_ATTEMPT_EVIDENCE_SHA256: ${{ needs.acquire_exclusive_publisher.outputs.attempt_sha256 }}
          CNYOS_CONTROLLER_PROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/promotion.json
          CNYOS_EXPECTED_PROMOTION_EVIDENCE_SHA256: ${{ needs.promote_and_validate.outputs.promotion_sha256 }}
          CNYOS_CONTROLLER_FINAL_CURRENT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/final-current.json
          CNYOS_EXPECTED_FINAL_CURRENT_EVIDENCE_SHA256: ${{ needs.verify_promoted_final_current.outputs.final_current_sha256 }}
          CNYOS_CONTROLLER_UAT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/uat.json
          CNYOS_EXPECTED_UAT_EVIDENCE_SHA256: ${{ needs.run_promoted_uat.outputs.uat_sha256 }}
          CNYOS_CONTROLLER_PUBLISHER_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/publisher-release.json
        run: |
          test -z "${CNYOS_STAGING_NETLIFY_AUTH_TOKEN+set}"
          test -z "${NETLIFY_AUTH_TOKEN+set}"
          test -z "${CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          test -z "${CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN+set}"
          test -z "${CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY+set}"
          node ops/cnyos-staging-controller/scripts/verify-producer-bundle.mjs
          test "$(sha256sum "$CNYOS_CONTROLLER_EXCLUSIVE_PUBLISHER_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_EXCLUSIVE_PUBLISHER_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_PUBLISH_ATTEMPT_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_PUBLISH_ATTEMPT_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_PROMOTION_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_PROMOTION_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_FINAL_CURRENT_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_FINAL_CURRENT_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_UAT_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_UAT_EVIDENCE_SHA256"
          node ops/cnyos-staging-controller/scripts/release-netlify-exclusive-publisher.mjs
          echo "publisher_release_sha256=$(sha256sum "$CNYOS_CONTROLLER_PUBLISHER_RELEASE_EVIDENCE_PATH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Close the cross-linked evidence set in a credential-free process
        id: finalize
        working-directory: controller
        env:
          CNYOS_CONTROLLER_RUNTIME_PROOF_ENVELOPE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/runtime-proof-envelope.json
          CNYOS_EXPECTED_RUNTIME_PROOF_ENVELOPE_SHA256: ${{ needs.authorize_preflight.outputs.runtime_proof_sha256 }}
          CNYOS_PRODUCER_BUNDLE_DIRECTORY: ${{ github.workspace }}/controller/release-chain/producer
          CNYOS_EXPECTED_PRODUCER_MANIFEST_SHA256: ${{ needs.produce.outputs.manifest_sha256 }}
          CNYOS_CONTROLLER_AUTHORIZATION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/authorization.json
          CNYOS_EXPECTED_AUTHORIZATION_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.authorization_sha256 }}
          CNYOS_CONTROLLER_GITHUB_PRECREDENTIAL_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/github-release-precredential.json
          CNYOS_EXPECTED_GITHUB_PRECREDENTIAL_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.live_github_precredential_sha256 }}
          CNYOS_CONTROLLER_GITHUB_PREPROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/github-release-prepromotion.json
          CNYOS_EXPECTED_GITHUB_PREPROMOTION_EVIDENCE_SHA256: ${{ needs.verify_github_release_boundary_prepromotion.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_AUTHORIZATION_BUNDLE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/authorization-verification-bundle.json
          CNYOS_EXPECTED_AUTHORIZATION_BUNDLE_SHA256: ${{ needs.authorize_preflight.outputs.authorization_bundle_sha256 }}
          CNYOS_CONTROLLER_ROLLBACK_ATTESTATION_DEPOSIT_RECEIPT_PATH: ${{ github.workspace }}/controller/release-chain/evidence/rollback-attestation-deposit-receipt.json
          CNYOS_EXPECTED_ROLLBACK_ATTESTATION_DEPOSIT_RECEIPT_SHA256: ${{ needs.authorize_preflight.outputs.rollback_attestation_receipt_sha256 }}
          CNYOS_CONTROLLER_ROLLBACK_ATTESTATION_DEPOSIT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/rollback-attestation-deposit-validation.json
          CNYOS_EXPECTED_ROLLBACK_ATTESTATION_DEPOSIT_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.rollback_attestation_evidence_sha256 }}
          CNYOS_CONTROLLER_LIVE_NETLIFY_AUTHORITY_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/live-netlify-authority-boundary.json
          CNYOS_EXPECTED_LIVE_NETLIFY_AUTHORITY_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.live_netlify_authority_sha256 }}
          CNYOS_CONTROLLER_FUNCTION_ENV_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/function-environment.json
          CNYOS_EXPECTED_FUNCTION_ENV_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.function_environment_sha256 }}
          CNYOS_CONTROLLER_BACKUP_DISABLE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/backup-disable-runtime-boundary.json
          CNYOS_EXPECTED_BACKUP_DISABLE_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.backup_disable_sha256 }}
          CNYOS_CONTROLLER_RUNTIME_CAPABILITY_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/runtime-capability.json
          CNYOS_EXPECTED_RUNTIME_CAPABILITY_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.runtime_capability_sha256 }}
          CNYOS_CONTROLLER_RECONCILIATION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/pre-release-reconciliation.json
          CNYOS_EXPECTED_RECONCILIATION_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.pre_release_reconciliation_sha256 }}
          CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/preflight.json
          CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.preflight_sha256 }}
          CNYOS_CONTROLLER_ROLLBACK_READINESS_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/rollback-readiness.json
          CNYOS_EXPECTED_ROLLBACK_READINESS_EVIDENCE_SHA256: ${{ needs.rollback_readiness.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_DRAFT_GATE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-gate.json
          CNYOS_EXPECTED_DRAFT_GATE_EVIDENCE_SHA256: ${{ needs.draft_deploy.outputs.draft_gate_sha256 }}
          CNYOS_CONTROLLER_DRAFT_INTENT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-intent.json
          CNYOS_EXPECTED_DRAFT_INTENT_EVIDENCE_SHA256: ${{ needs.draft_deploy.outputs.draft_intent_sha256 }}
          CNYOS_CONTROLLER_DRAFT_RECEIPT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-receipt.json
          CNYOS_EXPECTED_DRAFT_RECEIPT_EVIDENCE_SHA256: ${{ needs.draft_deploy.outputs.draft_receipt_sha256 }}
          CNYOS_CONTROLLER_DRAFT_ACCESS_BOUNDARY_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-access-boundary.json
          CNYOS_EXPECTED_DRAFT_ACCESS_BOUNDARY_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.draft_access_boundary_sha256 }}
          CNYOS_CONTROLLER_DRAFT_METADATA_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-metadata.json
          CNYOS_EXPECTED_DRAFT_METADATA_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.draft_metadata_sha256 }}
          CNYOS_CONTROLLER_DRAFT_VERIFICATION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/draft-verification.json
          CNYOS_EXPECTED_DRAFT_VERIFICATION_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.draft_verification_sha256 }}
          CNYOS_CONTROLLER_CONTROL_BEHAVIOR_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/control-behavior.json
          CNYOS_EXPECTED_CONTROL_BEHAVIOR_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.control_behavior_sha256 }}
          CNYOS_CONTROLLER_PRIVATE_DRAFT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/private-draft.json
          CNYOS_EXPECTED_PRIVATE_DRAFT_EVIDENCE_SHA256: ${{ needs.verify_draft.outputs.private_draft_sha256 }}
          CNYOS_CONTROLLER_EXCLUSIVE_PUBLISHER_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/exclusive-publisher.json
          CNYOS_EXPECTED_EXCLUSIVE_PUBLISHER_EVIDENCE_SHA256: ${{ needs.acquire_exclusive_publisher.outputs.exclusive_publisher_sha256 }}
          CNYOS_CONTROLLER_PUBLISH_ATTEMPT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/promotion-attempt.json
          CNYOS_EXPECTED_PUBLISH_ATTEMPT_EVIDENCE_SHA256: ${{ needs.acquire_exclusive_publisher.outputs.attempt_sha256 }}
          CNYOS_CONTROLLER_PROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/promotion.json
          CNYOS_EXPECTED_PROMOTION_EVIDENCE_SHA256: ${{ needs.promote_and_validate.outputs.promotion_sha256 }}
          CNYOS_CONTROLLER_POST_PROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/post-promotion.json
          CNYOS_EXPECTED_POST_PROMOTION_EVIDENCE_SHA256: ${{ needs.promote_and_validate.outputs.post_promotion_sha256 }}
          CNYOS_CONTROLLER_SCHEDULED_ROUTE_DENIAL_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/scheduled-route-denial.json
          CNYOS_EXPECTED_SCHEDULED_ROUTE_DENIAL_EVIDENCE_SHA256: ${{ needs.validate_promoted_routes.outputs.evidence_sha256 }}
          CNYOS_CONTROLLER_UAT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/uat.json
          CNYOS_EXPECTED_UAT_EVIDENCE_SHA256: ${{ needs.run_promoted_uat.outputs.uat_sha256 }}
          CNYOS_CONTROLLER_FINAL_CURRENT_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/final-current.json
          CNYOS_EXPECTED_FINAL_CURRENT_EVIDENCE_SHA256: ${{ needs.verify_promoted_final_current.outputs.final_current_sha256 }}
          CNYOS_CONTROLLER_PUBLISHER_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/publisher-release.json
          CNYOS_EXPECTED_PUBLISHER_RELEASE_EVIDENCE_SHA256: ${{ steps.release_publisher.outputs.publisher_release_sha256 }}
          CNYOS_CONTROLLER_FINAL_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/final.json
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN+set}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL+set}"
          test -z "${CNYOS_STAGING_NETLIFY_AUTH_TOKEN+set}"
          test -z "${NETLIFY_AUTH_TOKEN+set}"
          test -z "${CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN+set}"
          test -z "${CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY+set}"
          test -z "${CNYOS_STAGING_TEST_PASSWORD+set}"
          test -z "${CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN+set}"
          test -z "${CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY+set}"
          node ops/cnyos-staging-controller/scripts/finalize-evidence.mjs
          echo "final_sha256=$(sha256sum "$CNYOS_CONTROLLER_FINAL_EVIDENCE_PATH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Retain complete fail-closed evidence
        id: upload_final
        if: always()
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-final-${{ github.run_id }}
          path: controller/release-chain/evidence/
          if-no-files-found: error
          retention-days: 365

  commit_successful_release:
    name: Atomically commit the successful run and clear its broker barrier
    if: ${{ !cancelled() && needs.produce.result == 'success' && needs.authorize_release.result == 'success' && needs.release_and_finalize.result == 'success' }}
    needs: [produce, authorize_release, release_and_finalize]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cnyos-staging-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      terminal_receipt_sha256: ${{ steps.terminal_commit.outputs.terminal_receipt_sha256 }}
    steps:
      - name: Check out the exact protected controller for the terminal commit
        uses: actions/checkout@__PINNED_CHECKOUT_COMMIT_SHA__
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Download final evidence only from the successful producer job
        id: download_final
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-final-${{ github.run_id }}
          path: controller/release-chain/evidence
      - name: Download the independently produced exact-byte bundle
        id: download_producer
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-producer-${{ github.run_id }}
          path: controller/terminal-input/producer
      - name: Download the independently verified signed authorization evidence
        id: download_authorization
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-authorization-${{ github.run_id }}
          path: controller/terminal-input/authorization
      - name: Set up the OIDC-only terminal commit runtime
        uses: actions/setup-node@__PINNED_SETUP_NODE_COMMIT_SHA__
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: controller/ops/cnyos-staging-controller/package-lock.json
      - name: Install the reviewed controller lock without lifecycle scripts
        working-directory: controller/ops/cnyos-staging-controller
        run: npm ci --ignore-scripts
      - name: Commit the exact successful release as the terminal broker operation
        id: terminal_commit
        working-directory: controller
        env:
          CNYOS_RELEASE_FINALIZE_JOB_RESULT: ${{ needs.release_and_finalize.result }}
          CNYOS_PRODUCER_JOB_RESULT: ${{ needs.produce.result }}
          CNYOS_AUTHORIZATION_JOB_RESULT: ${{ needs.authorize_release.result }}
          CNYOS_FINAL_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_final.outcome }}
          CNYOS_PRODUCER_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_producer.outcome }}
          CNYOS_AUTHORIZATION_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_authorization.outcome }}
          CNYOS_TARGET_CONTROLLER_RUN_ID: ${{ github.run_id }}
          CNYOS_TARGET_CONTROLLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CNYOS_TARGET_CONTROLLER_COMMIT: ${{ github.sha }}
          CNYOS_NETLIFY_PUBLISH_BROKER_URL: ${{ vars.CNYOS_NETLIFY_PUBLISH_BROKER_URL }}
          CNYOS_PRODUCER_BUNDLE_DIRECTORY: ${{ github.workspace }}/controller/terminal-input/producer
          CNYOS_EXPECTED_PRODUCER_MANIFEST_SHA256: ${{ needs.produce.outputs.manifest_sha256 }}
          CNYOS_EXPECTED_PRODUCER_ARTIFACT_SHA256: ${{ needs.produce.outputs.artifact_sha256 }}
          CNYOS_EXPECTED_PRODUCER_FILE_COUNT: ${{ needs.produce.outputs.file_count }}
          CNYOS_EXPECTED_PRODUCER_CANDIDATE_TREE: ${{ needs.produce.outputs.candidate_tree }}
          CNYOS_EXPECTED_PRODUCER_FUNCTION_SOURCE_TREE: ${{ needs.produce.outputs.function_source_tree }}
          CNYOS_EXPECTED_GITHUB_ARTIFACT_DIGEST: ${{ needs.produce.outputs.github_artifact_digest }}
          CNYOS_CONTROLLER_AUTHORIZATION_EVIDENCE_PATH: ${{ github.workspace }}/controller/terminal-input/authorization/authorization.json
          CNYOS_EXPECTED_AUTHORIZATION_EVIDENCE_SHA256: ${{ needs.authorize_release.outputs.authorization_sha256 }}
          CNYOS_CONTROLLER_AUTHORIZATION_BUNDLE_PATH: ${{ github.workspace }}/controller/terminal-input/authorization/authorization-verification-bundle.json
          CNYOS_EXPECTED_AUTHORIZATION_BUNDLE_SHA256: ${{ needs.authorize_release.outputs.authorization_bundle_sha256 }}
          CNYOS_CONTROLLER_FINAL_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/final.json
          CNYOS_EXPECTED_FINAL_EVIDENCE_SHA256: ${{ needs.release_and_finalize.outputs.final_sha256 }}
          CNYOS_CONTROLLER_PUBLISHER_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/controller/release-chain/evidence/publisher-release.json
          CNYOS_EXPECTED_PUBLISHER_RELEASE_EVIDENCE_SHA256: ${{ needs.release_and_finalize.outputs.publisher_release_sha256 }}
          CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH: ${{ runner.temp }}/successful-release-terminal/successful-release-terminal.json
        run: |
          for forbidden_name in \
            CNYOS_GITHUB_ACTIONS_READ_TOKEN \
            CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN \
            CNYOS_STAGING_NETLIFY_AUTH_TOKEN \
            NETLIFY_AUTH_TOKEN \
            CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN \
            CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY \
            CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY \
            CNYOS_STAGING_TEST_PASSWORD
          do
            if printenv "$forbidden_name" >/dev/null; then
              echo "forbidden terminal-commit credential environment name is present: $forbidden_name" >&2
              exit 1
            fi
          done
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test "$CNYOS_RELEASE_FINALIZE_JOB_RESULT" = "success"
          test "$CNYOS_PRODUCER_JOB_RESULT" = "success"
          test "$CNYOS_AUTHORIZATION_JOB_RESULT" = "success"
          test "$CNYOS_FINAL_ARTIFACT_DOWNLOAD_OUTCOME" = "success"
          test "$CNYOS_PRODUCER_ARTIFACT_DOWNLOAD_OUTCOME" = "success"
          test "$CNYOS_AUTHORIZATION_ARTIFACT_DOWNLOAD_OUTCOME" = "success"
          echo "$CNYOS_EXPECTED_PRODUCER_MANIFEST_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          echo "$CNYOS_EXPECTED_PRODUCER_ARTIFACT_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          echo "$CNYOS_EXPECTED_PRODUCER_FILE_COUNT" | grep -Eq '^[1-9][0-9]*$'
          echo "$CNYOS_EXPECTED_PRODUCER_CANDIDATE_TREE" | grep -Eq '^[0-9a-f]{40}$'
          echo "$CNYOS_EXPECTED_PRODUCER_FUNCTION_SOURCE_TREE" | grep -Eq '^[0-9a-f]{40}$'
          echo "$CNYOS_EXPECTED_GITHUB_ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          echo "$CNYOS_EXPECTED_AUTHORIZATION_EVIDENCE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          echo "$CNYOS_EXPECTED_AUTHORIZATION_BUNDLE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          echo "$CNYOS_EXPECTED_FINAL_EVIDENCE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          echo "$CNYOS_EXPECTED_PUBLISHER_RELEASE_EVIDENCE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          test -f "$CNYOS_CONTROLLER_FINAL_EVIDENCE_PATH"
          test ! -L "$CNYOS_CONTROLLER_FINAL_EVIDENCE_PATH"
          test -f "$CNYOS_CONTROLLER_PUBLISHER_RELEASE_EVIDENCE_PATH"
          test ! -L "$CNYOS_CONTROLLER_PUBLISHER_RELEASE_EVIDENCE_PATH"
          test "$(sha256sum "$CNYOS_CONTROLLER_FINAL_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_FINAL_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_PUBLISHER_RELEASE_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_PUBLISHER_RELEASE_EVIDENCE_SHA256"
          node ops/cnyos-staging-controller/scripts/reconcile-netlify-release-state.mjs commit-successful-release
          test -f "$CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH"
          test ! -L "$CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH"
          terminal_receipt_sha256="$(sha256sum "$CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH" | cut -d ' ' -f 1)"
          echo "$terminal_receipt_sha256" | grep -Eq '^[0-9a-f]{64}$'
          echo "terminal_receipt_sha256=$terminal_receipt_sha256" >> "$GITHUB_OUTPUT"
      - name: Retain the signed successful-release terminal record
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-successful-release-terminal-${{ github.run_id }}
          path: ${{ runner.temp }}/successful-release-terminal/successful-release-terminal.json
          if-no-files-found: error
          retention-days: 365

  prepare_failed_release_reconciliation:
    name: Prepare signed failed-release recovery without Netlify credentials
    if: ${{ always() && needs.authorize_preflight.result == 'success' && (needs.draft_deploy.result != 'success' || needs.acquire_exclusive_publisher.result != 'success' || needs.promote_and_validate.result != 'success' || needs.validate_promoted_routes.result != 'success' || needs.run_promoted_uat.result != 'success' || needs.verify_promoted_final_current.result != 'success' || needs.release_and_finalize.result != 'success' || needs.commit_successful_release.result != 'success') }}
    needs: [authorize_preflight, prepare_draft_intent, draft_deploy, acquire_exclusive_publisher, promote_and_validate, validate_promoted_routes, run_promoted_uat, verify_promoted_final_current, release_and_finalize, commit_successful_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cnyos-staging-rollback
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      reconciliation_plan_sha256: ${{ steps.prepare.outputs.reconciliation_plan_sha256 }}
      rollback_chain_sha256: ${{ steps.prepare.outputs.rollback_chain_sha256 }}
      recovery_disposition: ${{ steps.prepare.outputs.recovery_disposition }}
      terminal_receipt_sha256: ${{ steps.prepare.outputs.terminal_receipt_sha256 }}
      recovery_terminal_receipt_sha256: ${{ steps.prepare.outputs.recovery_terminal_receipt_sha256 }}
    steps:
      - name: Check out the exact protected controller for recovery preparation
        uses: actions/checkout@__PINNED_CHECKOUT_COMMIT_SHA__
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Download the mandatory exact preflight chain
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-preflight-${{ github.run_id }}
          path: controller/recovery-input/evidence
      - name: Download durable draft intent only when its producer completed
        id: download_draft_intent
        if: ${{ needs.prepare_draft_intent.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-intent-${{ github.run_id }}
          path: controller/recovery-input/evidence
      - name: Download draft evidence only when its producer completed
        id: download_draft
        if: ${{ needs.draft_deploy.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-draft-${{ github.run_id }}
          path: controller/recovery-input/evidence
      - name: Download lease and attempt evidence only when their producer completed
        id: download_attempt
        if: ${{ needs.acquire_exclusive_publisher.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-attempt-${{ github.run_id }}
          path: controller/recovery-input/evidence
      - name: Download promotion evidence only when its producer completed
        id: download_promotion
        if: ${{ needs.promote_and_validate.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-promotion-${{ github.run_id }}
          path: controller/recovery-input/evidence
      - name: Download final evidence only when its producer completed
        id: download_final
        if: ${{ needs.release_and_finalize.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-final-${{ github.run_id }}
          path: controller/recovery-input/evidence
      - name: Set up the reviewed recovery-preparation runtime
        uses: actions/setup-node@__PINNED_SETUP_NODE_COMMIT_SHA__
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: controller/ops/cnyos-staging-controller/package-lock.json
      - name: Install the reviewed controller lock without lifecycle scripts
        working-directory: controller/ops/cnyos-staging-controller
        run: npm ci --ignore-scripts
      - name: Authenticate broker state and emit only a signed sanitized recovery plan
        id: prepare
        working-directory: controller
        env:
          CNYOS_DRAFT_INTENT_JOB_RESULT: ${{ needs.prepare_draft_intent.result }}
          CNYOS_DRAFT_INTENT_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_draft_intent.outcome }}
          CNYOS_DRAFT_DEPLOY_JOB_RESULT: ${{ needs.draft_deploy.result }}
          CNYOS_DRAFT_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_draft.outcome }}
          CNYOS_ACQUIRE_PUBLISHER_JOB_RESULT: ${{ needs.acquire_exclusive_publisher.result }}
          CNYOS_ATTEMPT_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_attempt.outcome }}
          CNYOS_PROMOTION_JOB_RESULT: ${{ needs.promote_and_validate.result }}
          CNYOS_PROMOTION_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_promotion.outcome }}
          CNYOS_ROUTE_VALIDATION_JOB_RESULT: ${{ needs.validate_promoted_routes.result }}
          CNYOS_UAT_JOB_RESULT: ${{ needs.run_promoted_uat.result }}
          CNYOS_FINAL_CURRENT_JOB_RESULT: ${{ needs.verify_promoted_final_current.result }}
          CNYOS_RELEASE_FINALIZE_JOB_RESULT: ${{ needs.release_and_finalize.result }}
          CNYOS_FINAL_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_final.outcome }}
          CNYOS_SUCCESSFUL_RELEASE_COMMIT_JOB_RESULT: ${{ needs.commit_successful_release.result }}
          CNYOS_TARGET_CONTROLLER_RUN_ID: ${{ github.run_id }}
          CNYOS_TARGET_CONTROLLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CNYOS_TARGET_CONTROLLER_COMMIT: ${{ github.sha }}
          CNYOS_CONTROLLER_RECOVERY_INPUT_DIRECTORY: ${{ github.workspace }}/controller/recovery-input/evidence
          CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH: ${{ github.workspace }}/controller/recovery-input/evidence/preflight.json
          CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.preflight_sha256 }}
          CNYOS_EXPECTED_DRAFT_RECEIPT_EVIDENCE_SHA256: ${{ needs.draft_deploy.outputs.draft_receipt_sha256 }}
          CNYOS_EXPECTED_DRAFT_INTENT_EVIDENCE_SHA256: ${{ needs.prepare_draft_intent.outputs.draft_intent_sha256 }}
          CNYOS_EXPECTED_EXCLUSIVE_PUBLISHER_EVIDENCE_SHA256: ${{ needs.acquire_exclusive_publisher.outputs.exclusive_publisher_sha256 }}
          CNYOS_EXPECTED_PUBLISH_ATTEMPT_EVIDENCE_SHA256: ${{ needs.acquire_exclusive_publisher.outputs.attempt_sha256 }}
          CNYOS_EXPECTED_PROMOTION_EVIDENCE_SHA256: ${{ needs.promote_and_validate.outputs.promotion_sha256 }}
          CNYOS_EXPECTED_FINAL_EVIDENCE_SHA256: ${{ needs.release_and_finalize.outputs.final_sha256 }}
          CNYOS_EXPECTED_PUBLISHER_RELEASE_EVIDENCE_SHA256: ${{ needs.release_and_finalize.outputs.publisher_release_sha256 }}
          CNYOS_CONTROLLER_AUTHORIZATION_BUNDLE_PATH: ${{ github.workspace }}/controller/recovery-input/evidence/authorization-verification-bundle.json
          CNYOS_EXPECTED_AUTHORIZATION_BUNDLE_SHA256: ${{ needs.authorize_preflight.outputs.authorization_bundle_sha256 }}
          CNYOS_CONTROLLER_ROLLBACK_ATTESTATION_DEPOSIT_RECEIPT_PATH: ${{ github.workspace }}/controller/recovery-input/evidence/rollback-attestation-deposit-receipt.json
          CNYOS_EXPECTED_ROLLBACK_ATTESTATION_DEPOSIT_RECEIPT_SHA256: ${{ needs.authorize_preflight.outputs.rollback_attestation_receipt_sha256 }}
          CNYOS_CONTROLLER_ROLLBACK_ATTESTATION_DEPOSIT_EVIDENCE_PATH: ${{ github.workspace }}/controller/recovery-input/evidence/rollback-attestation-deposit-validation.json
          CNYOS_EXPECTED_ROLLBACK_ATTESTATION_DEPOSIT_EVIDENCE_SHA256: ${{ needs.authorize_preflight.outputs.rollback_attestation_evidence_sha256 }}
          CNYOS_CONTROLLER_APPROVER_KEY_REGISTRY_PATH: ${{ github.workspace }}/controller/ops/cnyos-staging-controller/approver-registry.json
          CNYOS_ROLLBACK_ATTESTATION_BROKER_URL: ${{ vars.CNYOS_ROLLBACK_ATTESTATION_BROKER_URL }}
          CNYOS_NETLIFY_PUBLISH_BROKER_URL: ${{ vars.CNYOS_NETLIFY_PUBLISH_BROKER_URL }}
          CNYOS_DRAFT_LIFECYCLE_BROKER_URL: ${{ vars.CNYOS_DRAFT_LIFECYCLE_BROKER_URL }}
          CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH: ${{ runner.temp }}/reconciliation-preparation/reconciliation-plan.json
          CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH: ${{ runner.temp }}/reconciliation-preparation/rollback-authorization-chain.json
          CNYOS_CONTROLLER_RECOVERY_DISPOSITION_PATH: ${{ runner.temp }}/reconciliation-preparation/recovery-disposition.txt
          CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH: ${{ runner.temp }}/reconciliation-preparation/successful-release-terminal.json
          CNYOS_CONTROLLER_RECOVERY_TERMINAL_EVIDENCE_PATH: ${{ runner.temp }}/reconciliation-preparation/recovery-terminal.json
        run: |
          for forbidden_name in \
            CNYOS_GITHUB_ACTIONS_READ_TOKEN \
            CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN \
            CNYOS_STAGING_NETLIFY_AUTH_TOKEN \
            NETLIFY_AUTH_TOKEN \
            CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN \
            CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY \
            CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY \
            CNYOS_STAGING_TEST_PASSWORD
          do
            if printenv "$forbidden_name" >/dev/null; then
              echo "forbidden recovery-preparation credential environment name is present: $forbidden_name" >&2
              exit 1
            fi
          done
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -f "$CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH"
          test ! -L "$CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH"
          echo "$CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          test "$(sha256sum "$CNYOS_CONTROLLER_PREFLIGHT_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_PREFLIGHT_EVIDENCE_SHA256"
          node ops/cnyos-staging-controller/scripts/reconcile-netlify-release-state.mjs prepare-failed-release-reconciliation
          test -f "$CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH"
          test ! -L "$CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH"
          test -f "$CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH"
          test ! -L "$CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH"
          reconciliation_plan_sha256="$(sha256sum "$CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH" | cut -d ' ' -f 1)"
          rollback_chain_sha256="$(sha256sum "$CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH" | cut -d ' ' -f 1)"
          echo "$reconciliation_plan_sha256" | grep -Eq '^[0-9a-f]{64}$'
          echo "$rollback_chain_sha256" | grep -Eq '^[0-9a-f]{64}$'
          test -f "$CNYOS_CONTROLLER_RECOVERY_DISPOSITION_PATH"
          test ! -L "$CNYOS_CONTROLLER_RECOVERY_DISPOSITION_PATH"
          recovery_disposition="$(cat "$CNYOS_CONTROLLER_RECOVERY_DISPOSITION_PATH")"
          terminal_receipt_sha256=""
          recovery_terminal_receipt_sha256=""
          case "$recovery_disposition" in
            recovery_required)
              test ! -e "$CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH"
              test ! -e "$CNYOS_CONTROLLER_RECOVERY_TERMINAL_EVIDENCE_PATH"
              ;;
            terminal_success_rehydrated)
              test -f "$CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH"
              test ! -L "$CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH"
              test ! -e "$CNYOS_CONTROLLER_RECOVERY_TERMINAL_EVIDENCE_PATH"
              terminal_receipt_sha256="$(sha256sum "$CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH" | cut -d ' ' -f 1)"
              echo "$terminal_receipt_sha256" | grep -Eq '^[0-9a-f]{64}$'
              ;;
            terminal_recovery_rehydrated)
              test ! -e "$CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH"
              test -f "$CNYOS_CONTROLLER_RECOVERY_TERMINAL_EVIDENCE_PATH"
              test ! -L "$CNYOS_CONTROLLER_RECOVERY_TERMINAL_EVIDENCE_PATH"
              recovery_terminal_receipt_sha256="$(sha256sum "$CNYOS_CONTROLLER_RECOVERY_TERMINAL_EVIDENCE_PATH" | cut -d ' ' -f 1)"
              echo "$recovery_terminal_receipt_sha256" | grep -Eq '^[0-9a-f]{64}$'
              ;;
            *)
              echo "invalid recovery disposition" >&2
              exit 1
              ;;
          esac
          echo "reconciliation_plan_sha256=$reconciliation_plan_sha256" >> "$GITHUB_OUTPUT"
          echo "rollback_chain_sha256=$rollback_chain_sha256" >> "$GITHUB_OUTPUT"
          echo "recovery_disposition=$recovery_disposition" >> "$GITHUB_OUTPUT"
          echo "terminal_receipt_sha256=$terminal_receipt_sha256" >> "$GITHUB_OUTPUT"
          echo "recovery_terminal_receipt_sha256=$recovery_terminal_receipt_sha256" >> "$GITHUB_OUTPUT"
      - name: Retain the signed plan and sanitized rollback authorization chain
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-reconciliation-preparation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reconciliation-preparation/reconciliation-plan.json
            ${{ runner.temp }}/reconciliation-preparation/rollback-authorization-chain.json
            ${{ runner.temp }}/reconciliation-preparation/recovery-disposition.txt
            ${{ runner.temp }}/reconciliation-preparation/successful-release-terminal.json
            ${{ runner.temp }}/reconciliation-preparation/recovery-terminal.json
          if-no-files-found: error
          retention-days: 365

  reconcile_failed_release:
    name: Execute only the signed failed-release plan with the rollback principal
    if: ${{ always() && needs.prepare_failed_release_reconciliation.result == 'success' && needs.prepare_failed_release_reconciliation.outputs.recovery_disposition == 'recovery_required' }}
    needs: prepare_failed_release_reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cnyos-staging-rollback
    permissions:
      actions: read
      contents: read
      id-token: none
    outputs:
      execution_receipt_sha256: ${{ steps.execute.outputs.execution_receipt_sha256 }}
    steps:
      - name: Check out the exact protected controller for recovery execution
        uses: actions/checkout@__PINNED_CHECKOUT_COMMIT_SHA__
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Set up the reviewed recovery-execution runtime
        uses: actions/setup-node@__PINNED_SETUP_NODE_COMMIT_SHA__
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: controller/ops/cnyos-staging-controller/package-lock.json
      - name: Install the reviewed controller lock without lifecycle scripts
        working-directory: controller/ops/cnyos-staging-controller
        run: npm ci --ignore-scripts
      - name: Download the exact signed recovery preparation
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-reconciliation-preparation-${{ github.run_id }}
          path: controller/reconciliation-preparation
      - name: Restore and clean up only objects authorized by the signed plan
        id: execute
        working-directory: controller
        env:
          CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN: ${{ secrets.CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN }}
          CNYOS_TARGET_CONTROLLER_RUN_ID: ${{ github.run_id }}
          CNYOS_TARGET_CONTROLLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CNYOS_TARGET_CONTROLLER_COMMIT: ${{ github.sha }}
          CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH: ${{ github.workspace }}/controller/reconciliation-preparation/reconciliation-plan.json
          CNYOS_EXPECTED_RECONCILIATION_PLAN_SHA256: ${{ needs.prepare_failed_release_reconciliation.outputs.reconciliation_plan_sha256 }}
          CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH: ${{ github.workspace }}/controller/reconciliation-preparation/rollback-authorization-chain.json
          CNYOS_EXPECTED_ROLLBACK_CHAIN_EVIDENCE_SHA256: ${{ needs.prepare_failed_release_reconciliation.outputs.rollback_chain_sha256 }}
          CNYOS_CONTROLLER_RECONCILIATION_EXECUTION_RECEIPT_PATH: ${{ runner.temp }}/reconciliation-netlify/reconciliation-execution-receipt.json
          CNYOS_REQUIRED_RECOVERY_DISPOSITION: recovery_required
        run: |
          for forbidden_name in \
            ACTIONS_ID_TOKEN_REQUEST_URL \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            CNYOS_GITHUB_ACTIONS_READ_TOKEN \
            CNYOS_ROLLBACK_ATTESTATION_BROKER_URL \
            CNYOS_NETLIFY_PUBLISH_BROKER_URL \
            CNYOS_DRAFT_LIFECYCLE_BROKER_URL \
            CNYOS_NETLIFY_AUTHORITY_BROKER_URL \
            CNYOS_NETLIFY_PRINCIPAL_MEMBERSHIP_BROKER_URL \
            CNYOS_STAGING_NETLIFY_AUTH_TOKEN \
            NETLIFY_AUTH_TOKEN \
            CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN \
            CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY \
            CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY \
            CNYOS_STAGING_TEST_PASSWORD
          do
            if printenv "$forbidden_name" >/dev/null; then
              echo "forbidden recovery-execution environment name is present: $forbidden_name" >&2
              exit 1
            fi
          done
          test -n "$CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN"
          test "$CNYOS_REQUIRED_RECOVERY_DISPOSITION" = "recovery_required"
          echo "$CNYOS_EXPECTED_RECONCILIATION_PLAN_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          echo "$CNYOS_EXPECTED_ROLLBACK_CHAIN_EVIDENCE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          test -f "$CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH"
          test ! -L "$CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH"
          test -f "$CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH"
          test ! -L "$CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH"
          test "$(sha256sum "$CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_RECONCILIATION_PLAN_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_ROLLBACK_CHAIN_EVIDENCE_SHA256"
          node ops/cnyos-staging-controller/scripts/reconcile-netlify-release-state.mjs execute-failed-release-reconciliation-plan
          test -f "$CNYOS_CONTROLLER_RECONCILIATION_EXECUTION_RECEIPT_PATH"
          test ! -L "$CNYOS_CONTROLLER_RECONCILIATION_EXECUTION_RECEIPT_PATH"
          execution_receipt_sha256="$(sha256sum "$CNYOS_CONTROLLER_RECONCILIATION_EXECUTION_RECEIPT_PATH" | cut -d ' ' -f 1)"
          echo "$execution_receipt_sha256" | grep -Eq '^[0-9a-f]{64}$'
          echo "execution_receipt_sha256=$execution_receipt_sha256" >> "$GITHUB_OUTPUT"
      - name: Retain the exact Netlify recovery execution receipt
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-reconciliation-netlify-${{ github.run_id }}
          path: ${{ runner.temp }}/reconciliation-netlify/reconciliation-execution-receipt.json
          if-no-files-found: error
          retention-days: 365

  finalize_failed_release_reconciliation:
    name: Finalize recovery state with OIDC and no Netlify credentials
    if: ${{ always() && needs.authorize_preflight.result == 'success' && (needs.draft_deploy.result != 'success' || needs.acquire_exclusive_publisher.result != 'success' || needs.promote_and_validate.result != 'success' || needs.validate_promoted_routes.result != 'success' || needs.run_promoted_uat.result != 'success' || needs.verify_promoted_final_current.result != 'success' || needs.release_and_finalize.result != 'success' || needs.commit_successful_release.result != 'success') }}
    needs: [authorize_preflight, draft_deploy, acquire_exclusive_publisher, promote_and_validate, validate_promoted_routes, run_promoted_uat, verify_promoted_final_current, release_and_finalize, commit_successful_release, prepare_failed_release_reconciliation, reconcile_failed_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cnyos-staging-rollback
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the exact protected controller for recovery finalization
        uses: actions/checkout@__PINNED_CHECKOUT_COMMIT_SHA__
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Set up the reviewed recovery-finalization runtime
        uses: actions/setup-node@__PINNED_SETUP_NODE_COMMIT_SHA__
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: controller/ops/cnyos-staging-controller/package-lock.json
      - name: Install the reviewed controller lock without lifecycle scripts
        working-directory: controller/ops/cnyos-staging-controller
        run: npm ci --ignore-scripts
      - name: Download the signed preparation when available
        id: download_preparation
        if: ${{ needs.prepare_failed_release_reconciliation.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-reconciliation-preparation-${{ github.run_id }}
          path: controller/reconciliation-preparation
      - name: Download the execution receipt only after successful execution
        id: download_execution
        if: ${{ needs.reconcile_failed_release.result == 'success' && needs.reconcile_failed_release.outputs.execution_receipt_sha256 != '' }}
        continue-on-error: true
        uses: actions/download-artifact@__PINNED_DOWNLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-reconciliation-netlify-${{ github.run_id }}
          path: controller/reconciliation-netlify
      - name: Release broker state only after verified recovery or retain it as incomplete
        if: always()
        working-directory: controller
        env:
          CNYOS_PREPARATION_JOB_RESULT: ${{ needs.prepare_failed_release_reconciliation.result }}
          CNYOS_PREPARATION_DOWNLOAD_OUTCOME: ${{ steps.download_preparation.outcome }}
          CNYOS_EXECUTION_JOB_RESULT: ${{ needs.reconcile_failed_release.result }}
          CNYOS_EXECUTION_DOWNLOAD_OUTCOME: ${{ steps.download_execution.outcome }}
          CNYOS_RECOVERY_DISPOSITION: ${{ needs.prepare_failed_release_reconciliation.outputs.recovery_disposition }}
          CNYOS_TARGET_CONTROLLER_RUN_ID: ${{ github.run_id }}
          CNYOS_TARGET_CONTROLLER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CNYOS_TARGET_CONTROLLER_COMMIT: ${{ github.sha }}
          CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH: ${{ github.workspace }}/controller/reconciliation-preparation/reconciliation-plan.json
          CNYOS_EXPECTED_RECONCILIATION_PLAN_SHA256: ${{ needs.prepare_failed_release_reconciliation.outputs.reconciliation_plan_sha256 }}
          CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH: ${{ github.workspace }}/controller/reconciliation-preparation/rollback-authorization-chain.json
          CNYOS_EXPECTED_ROLLBACK_CHAIN_EVIDENCE_SHA256: ${{ needs.prepare_failed_release_reconciliation.outputs.rollback_chain_sha256 }}
          CNYOS_CONTROLLER_RECONCILIATION_EXECUTION_RECEIPT_PATH: ${{ github.workspace }}/controller/reconciliation-netlify/reconciliation-execution-receipt.json
          CNYOS_EXPECTED_RECONCILIATION_EXECUTION_RECEIPT_SHA256: ${{ needs.reconcile_failed_release.outputs.execution_receipt_sha256 }}
          CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH: ${{ github.workspace }}/controller/reconciliation-preparation/successful-release-terminal.json
          CNYOS_EXPECTED_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_SHA256: ${{ needs.prepare_failed_release_reconciliation.outputs.terminal_receipt_sha256 }}
          CNYOS_CONTROLLER_RECOVERY_TERMINAL_EVIDENCE_PATH: ${{ github.workspace }}/controller/reconciliation-preparation/recovery-terminal.json
          CNYOS_EXPECTED_RECOVERY_TERMINAL_EVIDENCE_SHA256: ${{ needs.prepare_failed_release_reconciliation.outputs.recovery_terminal_receipt_sha256 }}
          CNYOS_ROLLBACK_ATTESTATION_BROKER_URL: ${{ vars.CNYOS_ROLLBACK_ATTESTATION_BROKER_URL }}
          CNYOS_NETLIFY_PUBLISH_BROKER_URL: ${{ vars.CNYOS_NETLIFY_PUBLISH_BROKER_URL }}
          CNYOS_DRAFT_LIFECYCLE_BROKER_URL: ${{ vars.CNYOS_DRAFT_LIFECYCLE_BROKER_URL }}
          CNYOS_CONTROLLER_RECONCILIATION_FINALIZATION_EVIDENCE_PATH: ${{ runner.temp }}/reconciliation-finalization/reconciliation-finalization.json
        run: |
          for forbidden_name in \
            CNYOS_GITHUB_ACTIONS_READ_TOKEN \
            CNYOS_STAGING_NETLIFY_ROLLBACK_TOKEN \
            CNYOS_STAGING_NETLIFY_AUTH_TOKEN \
            NETLIFY_AUTH_TOKEN \
            CNYOS_STAGING_DRAFT_ACCESS_BOUNDARY_TOKEN \
            CNYOS_CREDENTIAL_SEPARATION_HMAC_KEY \
            CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY \
            CNYOS_STAGING_TEST_PASSWORD
          do
            if printenv "$forbidden_name" >/dev/null; then
              echo "forbidden recovery-finalization credential environment name is present: $forbidden_name" >&2
              exit 1
            fi
          done
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          preparation_verified=false
          if test "$CNYOS_PREPARATION_JOB_RESULT" = "success" && \
             test "$CNYOS_PREPARATION_DOWNLOAD_OUTCOME" = "success" && \
             echo "$CNYOS_EXPECTED_RECONCILIATION_PLAN_SHA256" | grep -Eq '^[0-9a-f]{64}$' && \
             echo "$CNYOS_EXPECTED_ROLLBACK_CHAIN_EVIDENCE_SHA256" | grep -Eq '^[0-9a-f]{64}$' && \
             test -f "$CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH" && \
             test ! -L "$CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH" && \
             test -f "$CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH" && \
             test ! -L "$CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH" && \
             test "$(sha256sum "$CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_RECONCILIATION_PLAN_SHA256" && \
             test "$(sha256sum "$CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_ROLLBACK_CHAIN_EVIDENCE_SHA256"
          then
            preparation_verified=true
          fi
          execution_verified=false
          if test "$CNYOS_EXECUTION_JOB_RESULT" = "success" && \
             test "$CNYOS_EXECUTION_DOWNLOAD_OUTCOME" = "success" && \
             echo "$CNYOS_EXPECTED_RECONCILIATION_EXECUTION_RECEIPT_SHA256" | grep -Eq '^[0-9a-f]{64}$' && \
             test -f "$CNYOS_CONTROLLER_RECONCILIATION_EXECUTION_RECEIPT_PATH" && \
             test ! -L "$CNYOS_CONTROLLER_RECONCILIATION_EXECUTION_RECEIPT_PATH" && \
             test "$(sha256sum "$CNYOS_CONTROLLER_RECONCILIATION_EXECUTION_RECEIPT_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_RECONCILIATION_EXECUTION_RECEIPT_SHA256"
          then
            execution_verified=true
          fi
          terminal_success_verified=false
          if test "$preparation_verified" = "true" && \
             test "$CNYOS_RECOVERY_DISPOSITION" = "terminal_success_rehydrated" && \
             echo "$CNYOS_EXPECTED_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_SHA256" | grep -Eq '^[0-9a-f]{64}$' && \
             test -f "$CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH" && \
             test ! -L "$CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH" && \
             test "$(sha256sum "$CNYOS_CONTROLLER_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_SUCCESSFUL_RELEASE_TERMINAL_EVIDENCE_SHA256"
          then
            terminal_success_verified=true
          fi
          terminal_recovery_verified=false
          if test "$preparation_verified" = "true" && \
             test "$CNYOS_RECOVERY_DISPOSITION" = "terminal_recovery_rehydrated" && \
             echo "$CNYOS_EXPECTED_RECOVERY_TERMINAL_EVIDENCE_SHA256" | grep -Eq '^[0-9a-f]{64}$' && \
             test -f "$CNYOS_CONTROLLER_RECOVERY_TERMINAL_EVIDENCE_PATH" && \
             test ! -L "$CNYOS_CONTROLLER_RECOVERY_TERMINAL_EVIDENCE_PATH" && \
             test "$(sha256sum "$CNYOS_CONTROLLER_RECOVERY_TERMINAL_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_RECOVERY_TERMINAL_EVIDENCE_SHA256"
          then
            terminal_recovery_verified=true
          fi
          if test "$preparation_verified" = "true" && \
             test "$CNYOS_RECOVERY_DISPOSITION" = "recovery_required" && \
             test "$execution_verified" = "true"
          then
            node ops/cnyos-staging-controller/scripts/reconcile-netlify-release-state.mjs finalize-failed-release-reconciliation-success
          elif test "$terminal_success_verified" = "true"; then
            node ops/cnyos-staging-controller/scripts/reconcile-netlify-release-state.mjs finalize-rehydrated-successful-release
          elif test "$terminal_recovery_verified" = "true"; then
            node ops/cnyos-staging-controller/scripts/reconcile-netlify-release-state.mjs finalize-rehydrated-recovery
          else
            if test "$preparation_verified" != "true"; then
              unset CNYOS_CONTROLLER_RECONCILIATION_PLAN_PATH
              unset CNYOS_EXPECTED_RECONCILIATION_PLAN_SHA256
              unset CNYOS_CONTROLLER_ROLLBACK_CHAIN_EVIDENCE_PATH
              unset CNYOS_EXPECTED_ROLLBACK_CHAIN_EVIDENCE_SHA256
              export CNYOS_RECOVERY_INCOMPLETE_REASON="unverified_recovery_preparation"
            elif test "$CNYOS_RECOVERY_DISPOSITION" = "terminal_success_rehydrated"; then
              unset CNYOS_CONTROLLER_RECONCILIATION_EXECUTION_RECEIPT_PATH
              unset CNYOS_EXPECTED_RECONCILIATION_EXECUTION_RECEIPT_SHA256
              export CNYOS_RECOVERY_INCOMPLETE_REASON="unverified_terminal_success_receipt"
            elif test "$CNYOS_RECOVERY_DISPOSITION" = "terminal_recovery_rehydrated"; then
              unset CNYOS_CONTROLLER_RECONCILIATION_EXECUTION_RECEIPT_PATH
              unset CNYOS_EXPECTED_RECONCILIATION_EXECUTION_RECEIPT_SHA256
              export CNYOS_RECOVERY_INCOMPLETE_REASON="unverified_terminal_recovery_receipt"
            elif test "$CNYOS_EXECUTION_JOB_RESULT" != "success"; then
              unset CNYOS_CONTROLLER_RECONCILIATION_EXECUTION_RECEIPT_PATH
              unset CNYOS_EXPECTED_RECONCILIATION_EXECUTION_RECEIPT_SHA256
              export CNYOS_RECOVERY_INCOMPLETE_REASON="execution_job_not_successful"
            else
              unset CNYOS_CONTROLLER_RECONCILIATION_EXECUTION_RECEIPT_PATH
              unset CNYOS_EXPECTED_RECONCILIATION_EXECUTION_RECEIPT_SHA256
              export CNYOS_RECOVERY_INCOMPLETE_REASON="unverified_execution_receipt"
            fi
            node ops/cnyos-staging-controller/scripts/reconcile-netlify-release-state.mjs record-incomplete-failed-release-reconciliation
          fi
          test -f "$CNYOS_CONTROLLER_RECONCILIATION_FINALIZATION_EVIDENCE_PATH"
          test ! -L "$CNYOS_CONTROLLER_RECONCILIATION_FINALIZATION_EVIDENCE_PATH"
      - name: Retain final recovery state without releasing on incomplete execution
        if: always()
        uses: actions/upload-artifact@__PINNED_UPLOAD_ARTIFACT_COMMIT_SHA__
        with:
          name: cnyos-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/reconciliation-finalization/reconciliation-finalization.json
          if-no-files-found: error
          retention-days: 365
