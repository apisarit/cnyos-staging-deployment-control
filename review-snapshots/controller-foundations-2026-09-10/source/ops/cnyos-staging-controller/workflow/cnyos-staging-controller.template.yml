          test "$(sha256sum "$CNYOS_CONTROLLER_DRAFT_GATE_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_DRAFT_GATE_EVIDENCE_SHA256"
          test "$(sha256sum "$CNYOS_CONTROLLER_DRAFT_INTENT_EVIDENCE_PATH" | cut -d ' ' -f 1)" = "$CNYOS_EXPECTED_DRAFT_INTENT_EVIDENCE_SHA256"
