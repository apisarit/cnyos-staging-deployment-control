services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/cnyos-vps-staging-web:${CNYOS_SOURCE_COMMIT:?CNYOS_SOURCE_COMMIT is required}
    restart: unless-stopped
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0700
    ports: ["127.0.0.1:18080:80"]
    networks: [webapp-network]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  webapp-network:
    external: true
