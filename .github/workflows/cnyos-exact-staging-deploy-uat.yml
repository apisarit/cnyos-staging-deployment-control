name: Exact CNYOS staging deploy and role-separated UAT

on:
  workflow_dispatch:
    inputs:
      controller_commit:
        description: Exact approved 40-character controller main commit
        required: true
        type: string
      app_commit:
        description: Exact reviewed lowercase 40-character application commit
        required: true
        type: string
      app_tree:
        description: Exact reviewed lowercase 40-character application tree
        required: true
        type: string
      rollback_deploy_id:
        description: Current known-good 24-character staging deploy ID
        required: true
        type: string
      run_reference:
        description: Opaque synthetic run reference; never copied into patient fields
        required: true
        type: string

# This workflow is a staging-only publisher. It cannot accept a site, origin,
# Supabase project, clinic or deployment class from dispatch input.
permissions:
  actions: read
  contents: read

concurrency:
  group: cnyos-exact-staging-887e058b-6e13-461f-b3c7-ae096b7046fe
  cancel-in-progress: false

jobs:
  admit-controller-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject every stale-controller or repeated dispatch
        shell: bash
        env:
          CNYOS_EXPECTED_CONTROLLER_COMMIT: ${{ inputs.controller_commit }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "apisarit/cnyos-staging-deployment-control"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "apisarit"
          test "$GITHUB_ACTOR_ID" = "216305243"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_ACTOR"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$CNYOS_EXPECTED_CONTROLLER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$CNYOS_EXPECTED_CONTROLLER_COMMIT" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_REF" = "apisarit/cnyos-staging-deployment-control/.github/workflows/cnyos-exact-staging-deploy-uat.yml@refs/heads/main"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

  build_candidate_artifact:
    needs: admit-controller-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CNYOS_EXPECTED_CONTROLLER_COMMIT: ${{ inputs.controller_commit }}
      CNYOS_EXPECTED_SOURCE_COMMIT: ${{ inputs.app_commit }}
      CNYOS_EXPECTED_SOURCE_TREE: ${{ inputs.app_tree }}
      CNYOS_EXPECTED_ROLLBACK_DEPLOY_ID: ${{ inputs.rollback_deploy_id }}
      CNYOS_STAGING_RUN_REFERENCE: ${{ inputs.run_reference }}
      CNYOS_FIXED_STAGING_SITE_ID: 887e058b-6e13-461f-b3c7-ae096b7046fe
      CNYOS_FIXED_STAGING_ORIGIN: https://cnyos-clinical-staging.netlify.app
      CNYOS_FIXED_STAGING_PROJECT_REF: hsmnjwxurlmsizndjlun
    outputs:
      artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_candidate.outputs.artifact-digest }}
    steps:
      - name: Initialize unprivileged candidate paths
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'CNYOS_EXACT_STAGING_WORK_DIRECTORY=%s/cnyos-candidate-work-%s\n' \
            "${RUNNER_TEMP:?}" "${GITHUB_RUN_ID:?}" >> "${GITHUB_ENV:?}"
          printf 'CNYOS_STAGING_ARTIFACT_DIRECTORY=%s/cnyos-exact-artifact-%s\n' \
            "${RUNNER_TEMP:?}" "${GITHUB_RUN_ID:?}" >> "${GITHUB_ENV:?}"

      - name: Checkout exact controller commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact private application commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: apisarit/chananya-clinical-wellness-os
          ref: ${{ inputs.app_commit }}
          path: candidate-source
          fetch-depth: 1
          token: ${{ secrets.CNYOS_APP_SOURCE_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify exact controller and fixed target admission
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "apisarit/cnyos-staging-deployment-control"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "apisarit"
          test "$GITHUB_ACTOR_ID" = "216305243"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_ACTOR"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$CNYOS_EXPECTED_CONTROLLER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$CNYOS_EXPECTED_CONTROLLER_COMMIT" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CNYOS_FIXED_STAGING_SITE_ID" = "887e058b-6e13-461f-b3c7-ae096b7046fe"
          test "$CNYOS_FIXED_STAGING_ORIGIN" = "https://cnyos-clinical-staging.netlify.app"
          test "$CNYOS_FIXED_STAGING_PROJECT_REF" = "hsmnjwxurlmsizndjlun"
          test "$CNYOS_FIXED_STAGING_SITE_ID" != "7da5e39e-580d-44f1-8623-605313e2fb2b"
          test "$CNYOS_FIXED_STAGING_PROJECT_REF" != "qptxnrldzzinlcabudjv"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test "$(git -C candidate-source rev-parse HEAD)" = "$CNYOS_EXPECTED_SOURCE_COMMIT"
          test "$(git -C candidate-source rev-parse 'HEAD^{tree}')" = "$CNYOS_EXPECTED_SOURCE_TREE"
          test -z "$(git -C candidate-source status --porcelain=v1 --untracked-files=all)"

      - name: Install locked application dependencies without ambient workflow channels
        shell: bash
        run: |
          set -Eeuo pipefail
          env -i \
            CI=true \
            HOME="${HOME:?}" \
            PATH="${PATH:?}" \
            TMPDIR="${RUNNER_TEMP:?}" \
            npm --prefix candidate-source ci --ignore-scripts

      - name: Run exact candidate contracts before credentials are scoped
        working-directory: candidate-source
        shell: bash
        run: |
          set -Eeuo pipefail
          env -i \
            CI=true \
            HOME="${HOME:?}" \
            PATH="${PATH:?}" \
            TMPDIR="${RUNNER_TEMP:?}" \
            npm run check
          env -i \
            CI=true \
            HOME="${HOME:?}" \
            PATH="${PATH:?}" \
            TMPDIR="${RUNNER_TEMP:?}" \
            node scripts/generate-staging-forward-reconciliation.mjs --check

      - name: Build exact connected staging artifact with publishable key only
        shell: bash
        env:
          CNYOS_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CNYOS_STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -Eeuo pipefail
          artifact="${CNYOS_STAGING_ARTIFACT_DIRECTORY:?}"
          mkdir -m 700 "$artifact"
          runtime_config="${RUNNER_TEMP:?}/tenant.cnyos-exact-staging-${GITHUB_RUN_ID:?}.json"
          node ops/cnyos-staging-controller/scripts/materialize-exact-staging-config.mjs \
            "$PWD/candidate-source/config/tenant.cnyos-staging.json" "$runtime_config"
          source_tree="$(git -C candidate-source rev-parse 'HEAD^{tree}')"
          build_time="$(git -C candidate-source show -s --format=%cI HEAD)"
          (
            cd candidate-source
            env -i \
              CI=true \
              HOME="${HOME:?}" \
              PATH="${PATH:?}" \
              TMPDIR="${RUNNER_TEMP:?}" \
              CONTEXT=production \
              URL=https://cnyos-clinical-staging.netlify.app \
              CLINICAL_OS_BUILD_TIMESTAMP="$build_time" \
              CLINICAL_OS_STAGING_DEPLOYMENT=true \
              CLINICAL_OS_ALLOW_STAGING_DATABASE=true \
              CLINICAL_OS_STAGING_DATABASE_ACK=STAGING_ONLY \
              CLINICAL_OS_TENANT_CONFIG_PATH="$runtime_config" \
              CLINICAL_OS_PRODUCTION_CONFIG_PATH=config/tenant.chananya.json \
              CLINICAL_OS_SOURCE_COMMIT="$CNYOS_EXPECTED_SOURCE_COMMIT" \
              CLINICAL_OS_SOURCE_TREE="$source_tree" \
              CLINICAL_OS_REQUIRE_SOURCE_COMMIT=true \
              npm run build:staging-artifact
            env -i \
              CI=true \
              HOME="${HOME:?}" \
              PATH="${PATH:?}" \
              TMPDIR="${RUNNER_TEMP:?}" \
              node scripts/materialize-staging-functions.mjs \
              --ref "$CNYOS_EXPECTED_SOURCE_COMMIT" \
              --output artifacts/controller-release/functions \
              --manifest artifacts/controller-release/function-input-manifest.json
          )
          cp -R candidate-source/dist "$artifact/dist"
          cp -R candidate-source/artifacts/controller-release/functions "$artifact/functions"
          cp candidate-source/artifacts/controller-release/function-input-manifest.json \
            "$artifact/function-input-manifest.json"
          mkdir -m 700 "$artifact/database"
          cp \
            candidate-source/supabase/manual/20261013230000_staging_forward_reconciliation_ce4cee52.psql \
            candidate-source/supabase/manual/20261013230000_staging_forward_reconciliation_ce4cee52.sql \
            candidate-source/supabase/manual/20261013230000_staging_forward_reconciliation_manifest.json \
            candidate-source/supabase/manual/20261013230000_staging_forward_reconciliation_verify.sql \
            candidate-source/supabase/migrations/20261017005000_audit_logs_governance_admin_read.sql \
            "$artifact/database/"
          CNYOS_DATABASE_DIRECTORY="$artifact/database" node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const directory = process.env.CNYOS_DATABASE_DIRECTORY;
          const names = (await fs.readdir(directory)).sort();
          const files = [];
          for (const name of names) {
            const bytes = await fs.readFile(path.join(directory, name));
            files.push({ path: name, size: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex'), mode: '100644' });
          }
          const manifest = {
            schemaVersion: 1, artifactType: 'cnyos-staging-database-inputs',
            source: { requestedRef: process.env.CNYOS_EXPECTED_SOURCE_COMMIT,
              resolvedRefObjectId: process.env.CNYOS_EXPECTED_SOURCE_COMMIT,
              sourceTreeObjectId: process.env.CNYOS_EXPECTED_SOURCE_TREE },
            target: { projectRef: 'hsmnjwxurlmsizndjlun',
              systemIdentifier: '7666007964130682852' },
            reconciliation: { legacyBundleSourceTree:
              'ce4cee52f1ad7fed574cadf8a5e62e0f181d0d67',
              finalAppTree: process.env.CNYOS_EXPECTED_SOURCE_TREE,
              generatorCheckRequired: true,
              auditMigrationIncluded: true },
            safety: { stagingOnly: true, productionAuthorized: false,
              resetAllowed: false, containsPatientData: false },
            fileCount: files.length, files,
            manifestSha256: crypto.createHash('sha256')
              .update(Buffer.from(JSON.stringify(files))).digest('hex')
          };
          await fs.writeFile(path.join(path.dirname(directory), 'database-input-manifest.json'),
            `${JSON.stringify(manifest)}\n`, { flag: 'wx', mode: 0o600 });
          NODE
          git -C candidate-source diff --exit-code
          git -C candidate-source diff --cached --exit-code
          test "$(git -C candidate-source rev-parse HEAD)" = "$CNYOS_EXPECTED_SOURCE_COMMIT"
          test "$(git -C candidate-source rev-parse 'HEAD^{tree}')" = "$CNYOS_EXPECTED_SOURCE_TREE"

      - name: Preflight the closed-world artifact without protected credentials
        working-directory: ops/cnyos-staging-controller
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {
            loadExactStagingConfig,
            verifyExactStagingArtifact
          } from './scripts/exact-staging-release.mjs';
          const result = await verifyExactStagingArtifact(loadExactStagingConfig());
          process.stdout.write(`Closed-world candidate ${result.artifact.source.commit}\n`);
          NODE

      - name: Upload exact closed-world candidate artifact
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cnyos-exact-staging-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/cnyos-exact-artifact-${{ github.run_id }}/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0
          overwrite: false

  exact-staging-deploy-uat:
    needs:
      - admit-controller-runtime
      - build_candidate_artifact
    environment:
      name: cnyos-staging-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CNYOS_EXPECTED_CONTROLLER_COMMIT: ${{ inputs.controller_commit }}
      CNYOS_EXPECTED_SOURCE_COMMIT: ${{ inputs.app_commit }}
      CNYOS_EXPECTED_SOURCE_TREE: ${{ inputs.app_tree }}
      CNYOS_EXPECTED_ROLLBACK_DEPLOY_ID: ${{ inputs.rollback_deploy_id }}
      CNYOS_STAGING_RUN_REFERENCE: ${{ inputs.run_reference }}
      CNYOS_FIXED_STAGING_SITE_ID: 887e058b-6e13-461f-b3c7-ae096b7046fe
      CNYOS_FIXED_STAGING_ORIGIN: https://cnyos-clinical-staging.netlify.app
      CNYOS_FIXED_STAGING_PROJECT_REF: hsmnjwxurlmsizndjlun
    steps:
      - name: Initialize fresh protected-runner paths
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'CNYOS_EXACT_STAGING_WORK_DIRECTORY=%s/cnyos-exact-staging-%s\n' \
            "${RUNNER_TEMP:?}" "${GITHUB_RUN_ID:?}" >> "${GITHUB_ENV:?}"
          printf 'CNYOS_STAGING_ARTIFACT_DIRECTORY=%s/cnyos-exact-artifact-%s\n' \
            "${RUNNER_TEMP:?}" "${GITHUB_RUN_ID:?}" >> "${GITHUB_ENV:?}"
          printf 'XDG_CONFIG_HOME=%s/cnyos-netlify-config\n' \
            "${RUNNER_TEMP:?}" >> "${GITHUB_ENV:?}"
          printf 'XDG_CACHE_HOME=%s/cnyos-netlify-cache\n' \
            "${RUNNER_TEMP:?}" >> "${GITHUB_ENV:?}"
          mkdir -m 700 \
            "${RUNNER_TEMP:?}/cnyos-netlify-config" \
            "${RUNNER_TEMP:?}/cnyos-netlify-cache"

      - name: Checkout exact controller commit on the fresh protected runner
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.controller_commit }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Node.js 24 on the fresh protected runner
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Re-attest exact controller and upstream artifact identity
        shell: bash
        env:
          CNYOS_CANDIDATE_ARTIFACT_ID: ${{ needs.build_candidate_artifact.outputs.artifact_id }}
          CNYOS_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build_candidate_artifact.outputs.artifact_digest }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "apisarit/cnyos-staging-deployment-control"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "apisarit"
          test "$GITHUB_ACTOR_ID" = "216305243"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_ACTOR"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$CNYOS_EXPECTED_CONTROLLER_COMMIT" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          [[ "$CNYOS_CANDIDATE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$CNYOS_CANDIDATE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

      - name: Install locked controller tooling from the restored commit
        shell: bash
        run: |
          set -Eeuo pipefail
          env -i \
            CI=true \
            HOME="${HOME:?}" \
            PATH="${PATH:?}" \
            TMPDIR="${RUNNER_TEMP:?}" \
            npm --prefix ops/cnyos-staging-controller ci --ignore-scripts
          env -i \
            CI=true \
            HOME="${HOME:?}" \
            PATH="${PATH:?}" \
            TMPDIR="${RUNNER_TEMP:?}" \
            npm --prefix ops/cnyos-staging-publisher ci --ignore-scripts
          publisher_version="$(ops/cnyos-staging-publisher/node_modules/.bin/netlify --version)"
          case "$publisher_version" in
            netlify-cli/23.1.2\ *) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install locked Chromium runtime from restored controller
        working-directory: ops/cnyos-staging-controller
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Download exact candidate artifact onto the fresh protected runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build_candidate_artifact.outputs.artifact_id }}
          path: ${{ runner.temp }}/cnyos-exact-artifact-${{ github.run_id }}
          merge-multiple: true

      - name: Fail closed on the immutable artifact transport digest
        shell: bash
        env:
          CNYOS_GITHUB_TOKEN: ${{ github.token }}
          CNYOS_CANDIDATE_ARTIFACT_ID: ${{ needs.build_candidate_artifact.outputs.artifact_id }}
          CNYOS_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build_candidate_artifact.outputs.artifact_digest }}
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP:?}/cnyos-exact-artifact-${GITHUB_RUN_ID:?}.zip"
          trap 'rm -f -- "$archive"' EXIT
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${CNYOS_GITHUB_TOKEN:?}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY:?}/actions/artifacts/${CNYOS_CANDIDATE_ARTIFACT_ID:?}/zip" \
            --output "$archive"
          observed_digest="$(sha256sum "$archive" | awk '{print $1}')"
          test "$observed_digest" = "$CNYOS_CANDIDATE_ARTIFACT_DIGEST"

      - name: Verify downloaded closed-world artifact before any publish or UAT secret
        working-directory: ops/cnyos-staging-controller
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node --input-type=module <<'NODE'
          import {
            loadExactStagingConfig,
            verifyExactStagingArtifact
          } from './scripts/exact-staging-release.mjs';
          const result = await verifyExactStagingArtifact(loadExactStagingConfig());
          process.stdout.write(`Verified downloaded candidate ${result.artifact.source.commit}\n`);
          NODE

      - name: Verify artifact and capture exact rollback baseline
        working-directory: ops/cnyos-staging-controller
        env:
          CNYOS_STAGING_NETLIFY_AUTH_TOKEN: ${{ secrets.CNYOS_STAGING_NETLIFY_AUTH_TOKEN }}
        run: node scripts/prepare-exact-staging-release.mjs

      - name: Reconcile and verify exact final-tree schema on fixed staging only
        working-directory: ops/cnyos-staging-controller
        env:
          CNYOS_STAGING_DATABASE_URL: ${{ secrets.CNYOS_STAGING_DATABASE_URL }}
        run: |
          set -Eeuo pipefail
          command -v psql >/dev/null
          psql --version
          node scripts/reconcile-exact-staging-database.mjs

      - name: Persist intent and attempt exact publish to fixed isolated staging
        id: publish_attempt
        working-directory: ops/cnyos-staging-controller
        env:
          CNYOS_STAGING_NETLIFY_AUTH_TOKEN: ${{ secrets.CNYOS_STAGING_NETLIFY_AUTH_TOKEN }}
        run: node scripts/exact-staging-publish.mjs attempt

      - name: Always reconcile the authoritative canonical staging deploy
        id: reconcile_publish
        if: ${{ always() && steps.publish_attempt.outcome != 'skipped' }}
        working-directory: ops/cnyos-staging-controller
        env:
          CNYOS_STAGING_NETLIFY_AUTH_TOKEN: ${{ secrets.CNYOS_STAGING_NETLIFY_AUTH_TOKEN }}
        run: node scripts/exact-staging-publish.mjs reconcile

      - name: Provision seven synthetic roles and run one bounded hosted journey
        if: ${{ steps.reconcile_publish.outputs.publish_reconciled == 'true' }}
        working-directory: ops/cnyos-staging-controller
        env:
          CNYOS_STAGING_NETLIFY_AUTH_TOKEN: ${{ secrets.CNYOS_STAGING_NETLIFY_AUTH_TOKEN }}
          CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CNYOS_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          CNYOS_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CNYOS_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          CNYOS_STAGING_SYNTHETIC_PRACTITIONER_PASSWORD: ${{ secrets.CNYOS_STAGING_SYNTHETIC_PRACTITIONER_PASSWORD }}
        run: node scripts/run-exact-staging-clinical-uat.mjs

      - name: Generate secret-free terminal success, failure or uncertainty evidence
        id: terminal-evidence
        if: ${{ always() }}
        working-directory: ops/cnyos-staging-controller
        run: node scripts/exact-staging-publish.mjs finalize

      - name: Retain bounded staging evidence even when UAT stops
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cnyos-exact-staging-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/cnyos-exact-staging-${{ github.run_id }}/upload/*.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
