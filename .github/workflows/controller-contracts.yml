name: Controller contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run controller contract suite
        run: |
          node tests/vps-staging-admission-workflow-contract.mjs
          node tests/broker-contract.mjs
          node tests/adapters-contract.mjs
